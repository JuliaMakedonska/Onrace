<!-- EXAMPLE: Saved races, loading (design-system/examples/README.md). A test of the system with a screen the product
     doesn't have (research/jtbd.md → Related job 2, the Multi-Region Season Planner): built only from design-system/,
     the Pushed screen pattern and the Skeleton, with no style of its own and every word in microcopy.md (rows 584–594). Not a
     product screen: not in the tab bar, the viewer or flows.md. What the system lacked for it is left out, not drawn,
     and listed in design-system/backlog.md → Examples: Saved races. -->
<body class="onrace">
  <div class="phone-screen">
    <header class="top-bar">
      <a class="back" href="../../wireframes/race-browse.html"><span>Discover</span></a>
      <h1 class="bar-title">Saved races</h1>
    </header>
    <main aria-busy="true">
      <div class="results-row">
        <p class="results-count" aria-live="polite"><span class="bar count" aria-hidden="true"></span><span class="visually-hidden" role="status">Loading saved races…</span></p>
      </div>
      <section id="list-view" class="list-area" aria-label="Saved races">
      <ul class="race-list" aria-hidden="true">
        <li>
          <div class="skeleton-card">
            <div class="bar photo"></div>
            <div class="bar title"></div>
            <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
            <div class="bar location"></div>
          </div>
        </li>
        <li>
          <div class="skeleton-card">
            <div class="bar photo"></div>
            <div class="bar title"></div>
            <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
            <div class="bar location"></div>
          </div>
        </li>
        <li>
          <div class="skeleton-card">
            <div class="bar photo"></div>
            <div class="bar title"></div>
            <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
            <div class="bar location"></div>
          </div>
        </li>
      </ul>
      </section>
    </main>
  </div>
</body>
