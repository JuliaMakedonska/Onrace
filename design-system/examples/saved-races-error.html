<title>Saved races, error · Onrace example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">

<!-- EXAMPLE: Saved races, error (design-system/examples/README.md). A test of the system with a screen the product
     doesn't have (research/jtbd.md → Related job 2, the Multi-Region Season Planner): built only from design-system/,
     the Pushed screen pattern and the Empty or error state pattern, with no style of its own and every word in microcopy.md (rows 584–594). Not a
     product screen: not in the tab bar, the viewer or flows.md. What the system lacked for it is left out, not drawn,
     and listed in design-system/backlog.md → Examples: Saved races. -->
<body class="onrace">
  <div class="phone-screen split-view">
    <header class="top-bar">
      <a class="back" href="../../wireframes/race-browse.html"><span>Discover</span></a>
      <h1 class="bar-title">Saved races</h1>
    </header>
    <main>
      <div class="state-message" role="alert">
        <h2>Couldn’t load your saved races</h2>
        <p>The connection may have dropped. Check it, then try again. Your saved races haven’t changed.</p>
        <div class="state-actions">
          <a class="state-action" href="saved-races-loading.html" data-retry aria-label="Try again, loading your saved races">Try again</a>
        </div>
      </div>
      <!-- ZONE: detail pane (Lesson 10 step 6, 2026-11-18; the Split view pattern, design-system/patterns/split-view.html).
           Not drawn on a phone. From the tablet breakpoint the list pane carries this state and the pane beside it
           keeps "No race selected" (microcopy.md row 596), as on Results list. -->
      <section class="split-detail" aria-label="Race detail" data-split-param="race" data-split-source="../../wireframes/race-detail.html" data-split-loading="../../wireframes/race-detail-loading.html" data-split-error="../../wireframes/race-detail-error.html">
        <div class="split-empty"><div class="state-message"><h2>No race selected</h2></div></div>
        <div class="split-content" hidden></div>
      </section>
    </main>
  </div>
<script src="../patterns/split-view.js"></script>   <!-- the Split view pattern: the pane beside the list from tablet width up (Lesson 10 step 6) -->
  <nav class="bottom-nav bottom-nav--pushed" aria-label="Global navigation">   <!-- a pushed screen's top bar: drawn on a desktop only (tab-bar.css; Lesson 10 step 7, 2026-11-20); aria-current="true" marks the section the screen belongs to -->
    <a class="nav-brand" href="../../wireframes/race-browse.html">Onrace</a>
    <ul>
      <li><a href="../../wireframes/race-browse.html" aria-current="true" data-tab="discover"><span>Discover</span></a></li>
      <li><a href="../../wireframes/results-list-loading.html?run=1" data-tab="results"><span>Results</span></a></li>
      <li><a href="../../wireframes/profile-loading.html?run=1" data-tab="profile"><span>Profile</span></a></li>
    </ul>
    <a class="nav-action" href="../../wireframes/log-result.html">Log result</a>
  </nav>
</body>
</html>
