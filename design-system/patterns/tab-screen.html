<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab screen · Onrace pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../index.css?v=942894f3">
<script src="../tokens/theme.js"></script>
</head>
<!-- PATTERN: Tab screen (design-system/patterns/README.md). Composed only of existing components: this page links
     design-system/index.css and nothing else, has no style block, no inline style and no class the components don't
     define (scripts/check_kit.py stops the build otherwise).
     Stands on: Race browse, Results list, Profile, each in every state (the large title in main's header, the top bar
     .top-bar--large over it, the floating .bottom-nav). Composed of: Large title header, Tab bar, and the screen's own
     content between them. Drawn here as Results list.
     Shown live on design-system/docs/patterns.html and specimens.html → Patterns, in a frame that loads this file. -->
<body class="onrace">
  <div class="phone-screen">
    <header class="top-bar top-bar--large" data-collapse>
      <span class="bar-title" aria-hidden="true">Results</span>
      <a class="bar-action" href="../../wireframes/log-result.html">Log result</a>
    </header>
    <main>
      <header>
        <h1>Results</h1>
      </header>
      <div class="results-row">
        <p class="results-count"><strong>4</strong> results <span class="results-order">Newest first</span></p>
      </div>
      <section aria-label="Results archive">
        <ul class="result-list">
          <li>
            <article class="result-card">
              <a class="card-link" href="../../wireframes/result-detail.html?result=deka-strong-chicago-2026">
                <div class="card-top">
                  <h2>DEKA STRONG Chicago</h2>
                  <span class="finish-time">24:36</span>
                </div>
                <p class="card-meta"><span class="sport-tag">DEKA</span> <time datetime="2026-03-14">14 Mar 2026</time></p>
                <p class="proof-label">Self-reported · via athlinks.com</p>
              </a>
            </article>
          </li>
        </ul>
      </section>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="Global navigation">
    <ul>
      <li><a href="../../wireframes/race-browse.html" data-tab="discover"><span>Discover</span></a></li>
      <li><a href="../../wireframes/results-list.html" data-tab="results" aria-current="page"><span>Results</span></a></li>
      <li><a href="../../wireframes/profile.html" data-tab="profile"><span>Profile</span></a></li>
    </ul>
  </nav>
</body>
</html>
