<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password (Loading) — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=bf5413b4">
</head>
<body class="onrace" role="application" aria-label="Onrace — Reset password, loading state (wireframe)">

  <!-- ZONE: top bar — iOS navigation bar inside the gate (_conventions.md
       § 1, "Inside a gate, steps drill down" and Back navigation;
       _screens.md → Reset password → Chrome). "‹ Sign in" is Flow 6's
       "back" edge → BackToSignIn (sign-in-sign-up.html, carrying ?next and
       ?email so the typed address is still there). On the error page it is
       also Retry? → no / "gives up" (DeadEnd11: leaves without a reset
       link), so no error repeats it as a button. The title "Reset
       password" is centred in the bar. No tab bar. It stays usable while
       loading: it doesn't depend on the request. -->
  <header class="top-bar">
    <a id="back" href="sign-in-sign-up.html"><svg class="back-chevron" aria-hidden="true" width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sign in</span></a>
    <h1 class="bar-title">Reset password</h1>
    <button type="button" class="bar-action" aria-busy="true" aria-disabled="true"><span class="visually-hidden">Sending…</span></button>
  </header>

  <div class="phone-screen">
    <main class="gate">

      <!-- ZONE: what this does — one line of context. It promises a link,
           not an email "sent to your account": Onrace can't know whether an
           account exists (flows.md → Revision note, password reset). -->
      <p class="context">Enter the email you signed up with, and we’ll send a reset link to it.</p>

      <!-- ZONE: request form, submitted — the same Email field and action
           as reset-password.html, locked (fieldset disabled). The email
           shown is the one entered (?email=), else a sample. -->
      <form id="reset-form" class="form-rows" aria-busy="true">
        <fieldset disabled>
          <div class="group">
            <ul class="rows">
              <li><div class="row"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="e.g. you@example.com" required value="maya.rossi@example.com"></div></li>
            </ul>
          </div>

        </fieldset>

        <!-- ZONE: status — Requesting: "Loading: sending reset link"
             (flows.md → Flow 6). The button itself says what's happening;
             the visually-hidden status carries it for assistive tech. -->
        <p class="visually-hidden" role="status">Sending the reset link…</p>
      </form>

    </main>
  </div><!-- /.phone-screen -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  // ?next= is where the person was heading before the gate. Same allowlist
  // as the Sign in files: owner-only screens only, so the flow can't be
  // pointed anywhere else.
  var next = params.get('next') || '';
  if (!/^(results-list[a-z-]*|log-result[a-z-]*|result-detail[a-z-]*|profile(-loading)?)\.html(\?[^#]*)?$/.test(next)) next = '';

  // The entered email travels as ?email= so Check inbox can name it.
  var email = params.get('email') || '';
  if (!/^[^\s@<>"]{1,64}@[^\s@<>"]{1,190}$/.test(email)) email = '';
  if (email) document.getElementById('email').value = email;

  function query(addr) {
    var q = [];
    if (next) q.push('next=' + encodeURIComponent(next));
    if (addr) q.push('email=' + encodeURIComponent(addr));
    return q;
  }

  // "‹ Sign in": back to the gate with ?next and ?email.
  var bq = query(email);
  document.getElementById('back').setAttribute('href', 'sign-in-sign-up.html' + (bq.length ? '?' + bq.join('&') : ''));

  // Only when reached through the flow (?run=1, set by the form's submit
  // and by Check inbox's "Send a new link"): after a short delay, answer
  // "Request accepted?" (Flow 6). Opened on its own (e.g. from index.html)
  // it stays put for inspection. Test switches (_conventions.md § 2),
  // nothing rendered for them:
  //   offline or &fail=1 → "no — connection" → reset-password-error.html
  //                        (RequestError).
  //   &rate=1            → "no — too many requests" →
  //                        reset-password-error.html?cause=rate (RateError).
  //   otherwise          → "yes — sent if an account exists" →
  //                        reset-password-check-inbox.html (ResetInbox).
  // ?email and ?next are carried to every exit.
  if (params.get('run') !== '1') return;
  window.setTimeout(function () {
    var q = query(email);
    if (!navigator.onLine || params.get('fail') === '1') {
      window.location.replace('reset-password-error.html' + (q.length ? '?' + q.join('&') : ''));
      return;
    }
    if (params.get('rate') === '1') {
      window.location.replace('reset-password-error.html?' + ['cause=rate'].concat(q).join('&'));
      return;
    }
    window.location.replace('reset-password-check-inbox.html' + (q.length ? '?' + q.join('&') : ''));
  }, 1200);
})();
</script>

</body>
</html>
