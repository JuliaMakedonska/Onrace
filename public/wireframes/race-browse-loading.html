<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race browse (Loading) — Onrace (wireframe)</title>
<style>
  /* STATE: loading — same structure and zones as race-browse.html (the
     success/default state); only the content inside those zones changes,
     per _conventions.md § 5. */

  /* Structure/hierarchy/zones + real interaction only — grayscale, no color,
     no custom fonts, no shadows, no icons. Deferred per _conventions.md § 7:
     color, fonts, shadows, icons, finished UI.

     This file is a bare screen: no nav tree, no spec-note/caption chrome —
     that lives once in index.html, which iframes this file into its own
     phone-frame mockup (see _conventions.md § 6). Opening this file directly
     still works: the body itself is the 390-wide, height-constrained,
     internally-scrolling "phone screen," just without index.html's outer
     device bezel. */

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0 auto;
    max-width: 390px;
    color: #000;
    background: #fff;
    line-height: 1.4;
    position: relative;
    overflow: hidden;
  }

  a { color: #000; }

  .phone-screen {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 56px; /* clears the fixed bottom-nav below */
  }

  /* Global nav (sitemap.md → Navigation § 1, 2 tabs) as a real mobile bottom
     tab bar — fixed to the frame's bottom edge, not part of the scrolling
     content, and not styled as browser-style top tabs. */
  .bottom-nav {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    background: #fff;
    border-top: 2px solid #000;
    z-index: 3;
  }
  .bottom-nav ul {
    list-style: none;
    display: flex;
    height: 100%;
    margin: 0;
    padding: 0;
  }
  .bottom-nav li { flex: 1; }
  .bottom-nav a {
    display: flex;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 0.8rem;
  }
  .bottom-nav a[aria-current="page"] { background: #000; color: #fff; }

  /* --- main is a flex column so the visible view panel (list or map) can
     take flex:1 and genuinely fill whatever space is left below the header/
     controls/results row, down to the bottom nav — this is what makes the
     map "fill the full space" without a hardcoded height, and lets a long
     card list overflow into .phone-screen's own scroll instead. --- */
  main {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header { padding: 16px 16px 8px; }
  h1 { font-size: 1.1rem; margin: 0; }

  /* --- shared controls: the control row (Filters + List/Map toggle) and the
     active-filter chips, together in one sticky block whose bottom border is
     the divider. Filtering is identical for both views — Map's own pan/zoom
     is a viewport change, not a filter (see the map-view comment below) —
     so there is exactly one Filters entry point, not one per view. --- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #fff;
    border-bottom: 1px solid #000;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
  }

  /* Filters is the primary control (it decides WHAT is shown; the toggle only
     decides HOW), so it takes the row's spare width and a heavier 2px border
     + bold label. It deliberately never uses the inverted black fill — that
     style means "current/pressed" (List/Map toggle, current nav tab) on this
     screen, and Filters is an action, not a state. Open = light gray. */
  .filters-trigger {
    flex: 1;
    border: 2px solid #000;
    background: #fff;
    padding: 8px 14px;
    margin: 0;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }
  .filters-trigger[aria-expanded="true"] { background: #e6e6e6; }

  .view-toggle {
    display: flex;
    border: 1px solid #000;
    margin: 0;
  }
  .view-btn {
    border: none;
    border-right: 1px solid #000;
    background: #fff;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .view-btn:last-child { border-right: none; }
  .view-btn[aria-pressed="true"] { background: #000; color: #fff; }

  /* --- active filter chips: shared, identical in both views, between the
     control row and the divider. One row only — overflows sideways with its
     own horizontal scroll instead of wrapping, so the sticky block's height
     stays fixed however many filters are on. "Clear all" sits outside the
     scrolling list so it's always visible, never scrolled off the end. --- */
  .chips-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 10px;
  }
  .chips-bar[hidden] { display: none; }
  .chips-row {
    list-style: none;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 0;
    overflow-x: auto;
  }
  .chips-row li { flex: none; }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #000;
    background: #fff;
    padding: 3px 8px;
    font: inherit;
    font-size: 0.8rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .clear-all {
    flex: none;
    border: none;
    background: none;
    padding: 3px 0;
    font: inherit;
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
  }

  /* --- results row: the filters' output sits with the results, below the
     divider, in the same place in both views. List: "N upcoming races ·
     Sort: …". Map: just "N races" — Sort is list-only (pins aren't
     sequenced), so the row keeps its position and only loses its tail. --- */
  .results-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 16px;
    font-size: 0.9rem;
  }
  .results-count { margin: 0; }
  .sort-control {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #333;
  }
  .sort-control[hidden] { display: none; }
  .sort-control::before { content: "·"; margin-right: 2px; color: #000; }
  .sort-control select {
    border: 1px solid #000;
    padding: 3px 6px;
    font: inherit;
    background: #fff;
  }

  /* Each view panel gets flex:1 when visible, so it fills the rest of main's
     column. min-height:0 lets it shrink/scroll correctly instead of forcing
     main taller than its flex basis. */
  .view-panel { flex: 1; min-height: 0; }
  /* #map-view sets display:flex, which beats the hidden attribute's UA
     display:none and would show both panels at once. ID-level selectors so
     this outranks #map-view / #list-view's own display rules. */
  #list-view[hidden], #map-view[hidden] { display: none; }

  #list-view { padding: 0 16px 16px; }

  /* --- race cards: short by design — name, sport tag + date, location.
     No field labels (the values are self-evident), no prose description
     (that belongs on Race detail), no separate button: the whole card is
     one link. Sized so 4 full cards fit on a phone-height screen, with the
     5th peeking in to signal the list scrolls. --- */
  .race-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 0;
    padding: 0;
  }
  article.race-card { border: 1px solid #000; }
  article.race-card a.card-link {
    display: block;
    padding: 20px 16px;
    text-decoration: none;
    color: inherit;
  }
  article.race-card a.card-link:hover,
  article.race-card a.card-link:focus-visible { background: #f2f2f2; }
  article.race-card h3 { margin: 0 0 12px 0; font-size: 1rem; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 8px 0;
    font-size: 0.88rem;
  }
  .sport-tag {
    border: 1px solid #000;
    padding: 1px 6px;
    font-size: 0.78rem;
  }
  .card-location { margin: 0; font-size: 0.88rem; color: #333; }

  /* --- map view: no padding (bleeds edge-to-edge), fills the remaining
     space between the results row and the bottom nav. --- */
  #map-view {
    display: flex;
    flex-direction: column;
  }
  .map-placeholder {
    flex: 1;
    border: 1px dashed #000;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.85rem;
    color: #555;
    padding: 16px;
  }

  /* --- bottom-sheet drawer + backdrop: real overlay, slides up over content --- */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); /* grayscale — black at reduced opacity, no hue */
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 5;
  }
  .sheet-backdrop.open { opacity: 1; }
  .sheet-backdrop[hidden] { display: none; }

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 75%;
    overflow-y: auto;
    background: #fff;
    border-top: 2px solid #000;
    padding: 12px 16px 20px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 6;
  }
  .sheet.open { transform: translateY(0); }
  .sheet[hidden] { display: none; }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: #999;
    margin: 0 auto 14px;
  }

  form div, form fieldset { margin-bottom: 12px; border: none; padding: 0; }
  fieldset { border: 1px solid #999; padding: 8px 10px; }
  legend { font-size: 0.85rem; padding: 0 4px; }
  form label { display: inline-block; margin-right: 14px; font-size: 0.9rem; }
  fieldset label { display: block; margin: 4px 0; }
  select, input[type="date"] {
    border: 1px solid #000;
    padding: 4px 6px;
    background: #fff;
    font: inherit;
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .sheet-actions button {
    flex: 1;
    border: 1px solid #000;
    padding: 9px 12px;
    font: inherit;
    cursor: pointer;
  }
  #filters-apply { background: #000; color: #fff; }
  #filters-close { background: #fff; color: #000; }

  /* --- loading skeletons: gray placeholder bars shaped like a race card's
     own zones (name, sport tag + date, location), same padding/border as a
     real card, so the layout doesn't jump when cards arrive. Static — no
     shimmer (finished-UI polish is deferred, _conventions.md § 7). --- */
  .skeleton-card { border: 1px solid #ccc; padding: 20px 16px; }
  .bar { background: #ddd; height: 12px; }
  .bar.title { height: 16px; width: 60%; margin-bottom: 18px; }
  .skel-meta { display: flex; gap: 8px; margin-bottom: 14px; }
  .bar.tag { height: 18px; width: 72px; }
  .bar.date { height: 18px; width: 90px; }
  .bar.location { height: 14px; width: 42%; }
  .bar.count { display: inline-block; width: 120px; height: 12px; vertical-align: middle; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .sort-control select:disabled { color: #999; border-color: #999; }
</style>
</head>
<body role="application" aria-label="Onrace — Race browse, loading state (wireframe)">

  <div class="phone-screen">

    <main>

      <header>
        <h1>Discover</h1>
      </header>

      <!-- ZONE: shared controls (sitemap.md: "Race browse (map + list)" — one
           screen, two representations of one result set). Sticky at the top of
           the scroll area so Filters, the List/Map toggle, and the active
           chips stay reachable while the list scrolls beneath; its bottom
           border is the divider. Filtering is identical for both views —
           panning or zooming the map only changes the viewport (see the
           map-view comment below), so the Filters drawer (region/date/sport)
           and the chips are the only ways either view gets narrowed.
           Filters and the toggle are siblings in one row (Filters decides
           WHAT you see, the toggle decides HOW), with Filters weighted as the
           primary control. Its label carries the active-filter count
           ("Filters · 2") once any filter is on. -->
      <div class="controls">
        <div class="control-row">
          <button type="button" id="filters-open" class="filters-trigger" aria-haspopup="dialog" aria-controls="filters-sheet" aria-expanded="false">Filters</button>
          <div class="view-toggle" role="group" aria-label="Choose view">
            <button type="button" class="view-btn" data-view="list" aria-pressed="true">List</button>
            <button type="button" class="view-btn" data-view="map" aria-pressed="false">Map</button>
          </div>
        </div>

        <!-- ZONE: active filter chips — one removable chip per active facet,
             plus "Clear all". Hidden here: no filters are applied in this
             default state. Removing a chip is a filter change, which in the
             real app re-runs the fetch (flows.md: filter change → Loading);
             the wireframe only removes the chip and resets the matching
             field in the Filters drawer, it doesn't fake new results. -->
        <div class="chips-bar" hidden>
          <ul class="chips-row" aria-label="Active filters"></ul>
          <button type="button" class="clear-all" data-clear-filters>Clear all</button>
        </div>
      </div>

      <!-- ZONE: results row — the count isn't known until the fetch returns,
           so a gray bar holds its place and the row doesn't reflow. Sort
           stays (list-only, as in the default state) but is disabled until
           there's something to order. -->
      <div class="results-row">
        <p class="results-count" aria-live="polite"><span class="bar count" aria-hidden="true"></span><span class="visually-hidden">Loading races…</span></p>
        <div class="sort-control" data-list-only>
          <label for="sort">Sort:</label>
          <select id="sort" name="sort" disabled>
            <option value="soonest" selected>Soonest first</option>
            <option value="farthest">Farthest first</option>
          </select>
        </div>
      </div>

      <section class="view-area" aria-label="Map or list view" style="display: contents;">

        <div id="list-view" class="view-panel">
          <!-- ZONE: loading state (_screens.md → Race browse → Loading; flows.md
               Loading("fetching races")) — fires on entry and again on every
               filter change. Skeletons sit exactly where the race-card list
               goes; they're placeholders, not races, so plain divs (not
               <article>) and hidden from assistive tech — aria-busy plus the
               status text in the results row carry the meaning instead. -->
          <ul class="race-list" aria-busy="true" aria-hidden="true">
            <li>
              <div class="skeleton-card">
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
          </ul>
        </div>

        <!-- Map view while the same fetch is in flight: pins arrive with the
             result set. -->
        <div id="map-view" class="view-panel" hidden>
          <div class="map-placeholder" role="img" aria-label="Map loading; race pins appear once races have loaded" aria-busy="true">
            [ map placeholder — loading race pins… ]
          </div>
        </div>

      </section>

    </main>

  </div><!-- /.phone-screen -->

  <!-- ZONE: global nav — 2 tabs, both destinations (sitemap.md → Navigation
       § 1, revised 2026-09-24). "Log result" is no longer a tab: it's the
       primary action button inside My Results (header + empty state), since
       tabs are for places and actions are buttons. Supersedes the earlier
       3-tab bar (Discover / Log Result / My Results). -->
  <nav class="bottom-nav" aria-label="Global navigation">
    <ul>
      <li><a href="race-browse.html" aria-current="page">Discover</a></li>
      <li><a href="results-list.html">My Results</a></li>
    </ul>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

  <div id="filters-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="filters-sheet-heading" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="filters-sheet-heading">Filters</h2>
    <form id="filters-form">
      <div>
        <label for="region">Region</label>
        <select id="region" name="region">
          <option value="">All regions</option>
          <option>Europe</option>
          <option>North America</option>
          <option>Middle East</option>
          <option>Asia-Pacific</option>
          <option>Africa</option>
        </select>
      </div>
      <div>
        <label for="date-from">Date from</label>
        <input type="date" id="date-from" name="date-from" value="2026-09-23" data-unfiltered="2026-09-23">
        <label for="date-to">Date to</label>
        <input type="date" id="date-to" name="date-to" value="2027-09-23" data-unfiltered="2027-09-23">
      </div>
      <fieldset>
        <legend>Sport type</legend>
        <label><input type="checkbox" name="sport" value="hyrox"> HYROX</label>
        <label><input type="checkbox" name="sport" value="deka"> DEKA / functional fitness</label>
        <label><input type="checkbox" name="sport" value="marathon"> Marathon</label>
        <label><input type="checkbox" name="sport" value="half-marathon"> Half marathon</label>
        <label><input type="checkbox" name="sport" value="triathlon"> Triathlon</label>
        <label><input type="checkbox" name="sport" value="ultra"> Ultra</label>
        <label><input type="checkbox" name="sport" value="ocr"> OCR</label>
      </fieldset>
      <div class="sheet-actions">
        <button type="button" id="filters-close">Close</button>
        <button type="submit" id="filters-apply">Apply filters</button>
      </div>
    </form>
  </div>

<script>
(function () {
  // --- Filters drawer. Opened by the control row's Filters button, and by
  // any [data-opens-filters] button a state page adds (e.g. the empty
  // state's "Loosen filters").
  var filtersBtn = document.getElementById('filters-open');
  var openBtns = document.querySelectorAll('.filters-trigger, [data-opens-filters]');
  var closeBtn = document.getElementById('filters-close');
  var sheet = document.getElementById('filters-sheet');
  var backdrop = document.getElementById('sheet-backdrop');
  var form = document.getElementById('filters-form');

  function openSheet() {
    sheet.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function () {
      sheet.classList.add('open');
      backdrop.classList.add('open');
    });
    filtersBtn.setAttribute('aria-expanded', 'true');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    filtersBtn.setAttribute('aria-expanded', 'false');
    window.setTimeout(function () {
      sheet.hidden = true;
      backdrop.hidden = true;
    }, 220);
  }

  openBtns.forEach(function (btn) {
    btn.addEventListener('click', openSheet);
  });
  closeBtn.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    closeSheet();
  });

  // --- Active filter chips. Each chip's data-filter/data-value names the
  // drawer field it mirrors; removing the chip resets that field, so the
  // chips, the drawer, and the "Filters · N" count never disagree.
  var chipsBar = document.querySelector('.chips-bar');
  var chipsRow = document.querySelector('.chips-row');

  function resetField(chip) {
    var filter = chip.getAttribute('data-filter');
    if (filter === 'region') {
      form.elements.region.value = '';
    } else if (filter === 'sport') {
      var box = form.querySelector('input[name="sport"][value="' + chip.getAttribute('data-value') + '"]');
      if (box) box.checked = false;
    } else if (filter === 'dates') {
      ['date-from', 'date-to'].forEach(function (id) {
        var input = document.getElementById(id);
        input.value = input.getAttribute('data-unfiltered');
      });
    }
  }

  function syncFilterCount() {
    var n = chipsRow.querySelectorAll('.chip').length;
    filtersBtn.textContent = n ? 'Filters · ' + n : 'Filters';
    chipsBar.hidden = n === 0;
  }

  chipsRow.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    resetField(chip);
    chip.parentNode.remove();
    syncFilterCount();
  });

  document.querySelectorAll('[data-clear-filters]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      chipsRow.querySelectorAll('.chip').forEach(function (chip) {
        resetField(chip);
        chip.parentNode.remove();
      });
      syncFilterCount();
    });
  });

  syncFilterCount();

  // --- List/Map toggle. Swaps the visible panel, and hides the results
  // row's list-only parts (Sort, and "upcoming" in the count) in Map.
  var viewButtons = document.querySelectorAll('.view-btn');
  var panels = {
    list: document.getElementById('list-view'),
    map: document.getElementById('map-view')
  };
  var listOnly = document.querySelectorAll('[data-list-only]');

  viewButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.getAttribute('data-view');
      viewButtons.forEach(function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (key) {
        panels[key].hidden = key !== view;
      });
      listOnly.forEach(function (el) {
        el.hidden = view !== 'list';
      });
    });
  });
})();
</script>

</body>
</html>
