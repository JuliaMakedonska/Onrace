<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race browse (Loading) — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=965858ec">
<link rel="stylesheet" href="../ui/map.css?v=965858ec">
</head>
<body class="onrace" data-state="loading" role="application" aria-label="Onrace — Race browse, loading state (wireframe)">

  <div class="phone-screen">

    <main>

      <header>
        <h1>Discover</h1>
        <!-- ZONE: search — find a race you already know by name or city
             (jtbd.md → Hypothesis 7 [?], added 2026-09-30). Outside the
             sticky controls, under the large title, so it scrolls away with
             the title (_conventions.md § 1, Search). Submitting is a filter
             change: flows.md "searches by race name or city" → Loading. -->
        <form class="race-search" id="race-search" role="search">
          <label class="visually-hidden" for="race-q">Search races by name or city</label>
          <input type="search" id="race-q" name="q" placeholder="Race name or city" autocomplete="off" enterkeyhint="search">
        </form>
      </header>

      <!-- ZONE: shared controls (sitemap.md: "Race browse (map + list)" — one
           screen, two representations of one result set). Sticky at the top of
           the scroll area so Filters, the List/Map toggle, and the active
           chips stay reachable while the list scrolls beneath; its bottom
           border is the divider. Filtering is identical for both views —
           panning or zooming the map only changes the viewport (see the
           map-view comment below), so the Filters drawer (region/date/sport)
           and the chips are the only ways either view gets narrowed.
           Filters and the toggle are siblings in one row (Filters decides
           WHAT you see, the toggle decides HOW), with Filters weighted as the
           primary control. Its label carries the active-filter count
           ("Filters · 2") once any filter is on. -->
      <div class="controls">
        <div class="control-row">
          <button type="button" id="filters-open" class="filters-trigger" aria-haspopup="dialog" aria-controls="filters-sheet" aria-expanded="false">Filters</button>
          <div class="view-toggle" role="group" aria-label="Choose view">
            <button type="button" class="view-btn" data-view="list" aria-pressed="true">List</button>
            <button type="button" class="view-btn" data-view="map" aria-pressed="false">Map</button>
          </div>
        </div>

        <!-- ZONE: active filter chips — one removable chip per active facet,
             plus "Clear all filters". Hidden here: no filters are applied in this
             default state. Removing a chip is a filter change, which in the
             real app re-runs the fetch (flows.md: filter change → Loading);
             the wireframe only removes the chip and resets the matching
             field in the Filters drawer, it doesn't fake new results. -->
        <div class="chips-bar" hidden>
          <ul class="chips-row" aria-label="Active filters"></ul>
          <button type="button" class="clear-all" data-clear-filters>Clear all filters</button>
        </div>
      </div>

      <!-- ZONE: results row — the count isn't known until the fetch returns,
           so a gray bar holds its place and the row doesn't reflow. Sort
           stays (list-only, as in the default state) but is disabled until
           there's something to order. -->
      <div class="results-row">
        <p class="results-count" aria-live="polite"><span class="bar count" aria-hidden="true"></span><span class="visually-hidden">Loading races…</span></p>
        <div class="sort-control" data-list-only>
          <label for="sort">Sort:</label>
          <select id="sort" name="sort" disabled>
            <option value="soonest" selected>Soonest first</option>
            <option value="farthest">Latest first</option>
          </select>
        </div>
      </div>

      <section class="view-area" aria-label="Map or list view">

        <div id="list-view" class="view-panel">
          <!-- ZONE: loading state (_screens.md → Race browse → Loading; flows.md
               Loading("fetching races")) — fires on entry and again on every
               filter change. Skeletons sit exactly where the race-card list
               goes; they're placeholders, not races, so plain divs (not
               <article>) and hidden from assistive tech — aria-busy plus the
               status text in the results row carry the meaning instead. -->
          <ul class="race-list" aria-busy="true" aria-hidden="true">
            <li>
              <div class="skeleton-card">
                <div class="bar photo"></div>
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar photo"></div>
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar photo"></div>
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar photo"></div>
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
            <li>
              <div class="skeleton-card">
                <div class="bar photo"></div>
                <div class="bar title"></div>
                <div class="skel-meta"><div class="bar tag"></div><div class="bar date"></div></div>
                <div class="bar location"></div>
              </div>
            </li>
          </ul>
        </div>

        <!-- Map view while the same fetch is in flight: pins arrive with the
             result set. -->
        <div id="map-view" class="view-panel" hidden>
          <div class="map-placeholder" role="img" aria-label="Loading races on the map…" aria-busy="true">
            [ map placeholder — loading race pins… ]
          </div>
        </div>

      </section>

    </main>

  </div><!-- /.phone-screen -->

  <!-- ZONE: global nav — 3 tabs, all destinations (sitemap.md → Navigation
       § 1, revised 2026-09-25): Discover / My Results / Profile. Profile is
       account infrastructure, always one tap away; signed out, it opens the
       same Sign in / Sign up gate as My Results. "Log result" is still not a
       tab: it's the primary action button inside My Results (header + empty
       state), since tabs are for places and actions are buttons. Supersedes
       the 2-tab bar (2026-09-24) and the earlier Discover / Log Result /
       My Results bar. -->
  <nav class="bottom-nav" aria-label="Global navigation">
    <ul>
      <li><a href="race-browse.html" aria-current="page"><svg class="tab-icon" aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><circle cx="13" cy="13" r="10.5"/><path d="m17.2 8.8-2.6 5.8-5.8 2.6 2.6-5.8z"/></svg><span>Discover</span></a></li>
      <!-- My Results and Profile are owner-only: data-requires-auth sends a
           signed-out person to the Sign in / Sign up gate first (flows.md
           "Signed in?"; the snippet at the end of this file). -->
      <li><a href="results-list-loading.html?run=1" data-requires-auth><svg class="tab-icon" aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="13" cy="14.5" r="9"/><path d="M10.5 2.5h5M13 2.5v3M13 14.5V9.5M20.5 6.5l1.5-1.5"/></svg><span>My Results</span></a></li>
      <li><a href="profile-loading.html?run=1" data-requires-auth><svg class="tab-icon" aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="13" cy="9" r="4.5"/><path d="M4.5 22.5c.9-4.3 4.2-7 8.5-7s7.6 2.7 8.5 7"/></svg><span>Profile</span></a></li>
    </ul>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

  <div id="filters-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="filters-sheet-heading" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="filters-sheet-heading">Filters</h2>
    <form id="filters-form">
      <div>
        <label for="region">Region</label>
        <select id="region" name="region">
          <option value="">All regions</option>
          <option>Europe</option>
          <option>North America</option>
          <option>Middle East</option>
          <option>Asia-Pacific</option>
          <option>Africa</option>
        </select>
      </div>
      <div>
        <label for="date-from">Race date from</label>
        <input type="date" id="date-from" name="date-from" value="2026-09-23" data-unfiltered="2026-09-23">
        <label for="date-to">Race date to</label>
        <input type="date" id="date-to" name="date-to" value="2027-09-23" data-unfiltered="2027-09-23">
      </div>
      <fieldset>
        <legend>Sport type</legend>
        <label><input type="checkbox" name="sport" value="hyrox"> HYROX</label>
        <label><input type="checkbox" name="sport" value="deka"> DEKA / functional fitness</label>
        <label><input type="checkbox" name="sport" value="marathon"> Marathon</label>
        <label><input type="checkbox" name="sport" value="half-marathon"> Half marathon</label>
        <label><input type="checkbox" name="sport" value="triathlon"> Triathlon</label>
        <label><input type="checkbox" name="sport" value="ultra"> Ultra</label>
        <label><input type="checkbox" name="sport" value="ocr"> OCR</label>
      </fieldset>
      <div class="sheet-actions">
        <button type="button" id="filters-close">Cancel</button>
        <button type="submit" id="filters-apply">Apply filters</button>
      </div>
    </form>
  </div>

<script>
(function () {
  // Shared by race-browse.html and its three state pages. Wires Main Job 1's
  // Race browse half of flows.md → "Main Job 1 — Discovery":
  //   Browse → "changes region/date/sport filters" → Loading
  //   Loading → HasResults? yes → Browse · no → Empty · connection fails → FetchError
  //   Empty → "adjusts filters" → Browse (via Loading) · FetchError → Retry? yes → Loading
  //   Browse → "taps a race card" → DetailLoading (race-detail-loading.html)
  // Filter state travels in the URL (region, from, to, sport) so every page
  // in the loop shows the same filters. The "fetch" is the seven sample races
  // below — the same ones as the cards and race-detail.html.
  var RACES = [
    { slug: 'berlin-marathon', name: 'Berlin Marathon', city: 'Berlin', sport: 'marathon', date: '2026-09-27', region: 'Europe' },
    { slug: 'hyrox-london', name: 'HYROX London', city: 'London', sport: 'hyrox', date: '2026-12-06', region: 'Europe' },
    { slug: 'hyrox-dallas', name: 'HYROX Dallas', city: 'Dallas', sport: 'hyrox', date: '2027-01-17', region: 'North America' },
    { slug: 'deka-strong-chicago', name: 'DEKA STRONG Chicago', city: 'Chicago', sport: 'deka', date: '2027-03-14', region: 'North America' },
    { slug: 'boston-marathon', name: 'Boston Marathon', city: 'Boston', sport: 'marathon', date: '2027-04-20', region: 'North America' },
    { slug: 'spartan-beast-killington', name: 'Spartan Race Beast — Killington', city: 'Killington', sport: 'ocr', date: '2027-07-11', region: 'North America' },
    { slug: 'utmb', name: 'UTMB — Ultra-Trail du Mont-Blanc', city: 'Chamonix', sport: 'ultra', date: '2027-08-24', region: 'Europe' }
  ];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var params = new URLSearchParams(window.location.search);
  var filtersBtn = document.getElementById('filters-open');
  var openBtns = document.querySelectorAll('.filters-trigger, [data-opens-filters]');
  var closeBtn = document.getElementById('filters-close');
  var sheet = document.getElementById('filters-sheet');
  var backdrop = document.getElementById('sheet-backdrop');
  var form = document.getElementById('filters-form');
  var fromInput = document.getElementById('date-from');
  var toInput = document.getElementById('date-to');
  var chipsBar = document.querySelector('.chips-bar');
  var chipsRow = document.querySelector('.chips-row');
  var searchForm = document.getElementById('race-search');
  var searchInput = document.getElementById('race-q');

  // --- Filter state: the drawer's form is the single source of truth.
  function readForm() {
    return {
      q: (searchInput.value || '').trim(),
      region: form.elements.region.value,
      from: fromInput.value,
      to: toInput.value,
      sports: Array.prototype.map.call(form.querySelectorAll('input[name="sport"]:checked'), function (b) { return b.value; })
    };
  }
  function unfiltered() {
    return { q: '', region: '', from: fromInput.getAttribute('data-unfiltered'), to: toInput.getAttribute('data-unfiltered'), sports: [] };
  }
  function datesFiltered(f) {
    return f.from !== fromInput.getAttribute('data-unfiltered') || f.to !== toInput.getAttribute('data-unfiltered');
  }
  function toParams(f) {
    var p = new URLSearchParams();
    if (f.q) p.set('q', f.q);
    if (f.region) p.set('region', f.region);
    if (datesFiltered(f)) { p.set('from', f.from); p.set('to', f.to); }
    f.sports.forEach(function (s) { p.append('sport', s); });
    return p;
  }
  function hasFilterParams(p) {
    return p.has('q') || p.has('region') || p.has('from') || p.has('to') || p.has('sport');
  }
  function writeForm(p) {
    var u = unfiltered();
    searchInput.value = p.get('q') || '';
    form.elements.region.value = p.get('region') || '';
    fromInput.value = p.get('from') || u.from;
    toInput.value = p.get('to') || u.to;
    var sports = p.getAll('sport');
    form.querySelectorAll('input[name="sport"]').forEach(function (b) { b.checked = sports.indexOf(b.value) > -1; });
  }
  function matches(f) {
    return RACES.filter(function (r) {
      return (!f.q || (r.name + ' ' + r.city).toLowerCase().indexOf(f.q.toLowerCase()) > -1) &&
        (!f.region || r.region === f.region) &&
        r.date >= f.from && r.date <= f.to &&
        (!f.sports.length || f.sports.indexOf(r.sport) > -1);
    });
  }
  function withRun(f) {
    var p = toParams(f);
    p.set('run', '1');
    return 'race-browse-loading.html?' + p.toString();
  }

  // --- Chips mirror the form: one removable chip per active facet.
  function fmt(iso, withYear) {
    var d = iso.split('-');
    return (+d[2]) + ' ' + MONTHS[+d[1] - 1] + (withYear ? ' ' + d[0] : '');
  }
  function addChip(label, facet, value, aria) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.setAttribute('data-filter', facet);
    if (value) btn.setAttribute('data-value', value);
    btn.setAttribute('aria-label', aria || 'Remove filter: ' + label);
    btn.appendChild(document.createTextNode(label + ' '));
    var x = document.createElement('span');
    x.setAttribute('aria-hidden', 'true');
    x.textContent = '×';
    btn.appendChild(x);
    li.appendChild(btn);
    chipsRow.appendChild(li);
  }
  function renderChips(f) {
    chipsRow.innerHTML = '';
    if (f.q) addChip('“' + f.q + '”', 'q', null, 'Clear search: “' + f.q + '”');
    if (f.region) addChip(f.region, 'region');
    f.sports.forEach(function (s) {
      var box = form.querySelector('input[name="sport"][value="' + s + '"]');
      addChip(box.parentNode.textContent.trim(), 'sport', s);
    });
    if (datesFiltered(f)) {
      var sameYear = f.from.slice(0, 4) === f.to.slice(0, 4);
      addChip(fmt(f.from, !sameYear) + ' – ' + fmt(f.to, true), 'dates');
    }
    var n = chipsRow.children.length;
    var nf = n - (f.q ? 1 : 0); // the search chip isn't a filter in the count
    filtersBtn.textContent = nf ? 'Filters · ' + nf : 'Filters';
    chipsBar.hidden = n === 0;
  }

  if (hasFilterParams(params)) writeForm(params);
  renderChips(readForm());

  // --- Every filter change is flows.md's "changes region/date/sport
  // filters" → Loading: Apply, a chip's ×, and Clear all all go to the
  // loading page, which then decides the outcome.
  chipsRow.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    var f = readForm();
    var facet = chip.getAttribute('data-filter');
    if (facet === 'q') f.q = '';
    if (facet === 'region') f.region = '';
    if (facet === 'sport') f.sports = f.sports.filter(function (s) { return s !== chip.getAttribute('data-value'); });
    if (facet === 'dates') { var u = unfiltered(); f.from = u.from; f.to = u.to; }
    window.location.href = withRun(f);
  });
  document.querySelectorAll('[data-clear-filters]').forEach(function (btn) {
    btn.addEventListener('click', function () { window.location.href = withRun(unfiltered()); });
  });

  // --- Filters drawer.
  function openSheet() {
    sheet.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(function () {
      sheet.classList.add('open');
      backdrop.classList.add('open');
    });
    filtersBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    filtersBtn.setAttribute('aria-expanded', 'false');
    window.setTimeout(function () {
      sheet.hidden = true;
      backdrop.hidden = true;
    }, 220);
  }
  openBtns.forEach(function (btn) { btn.addEventListener('click', openSheet); });
  closeBtn.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = withRun(readForm());
  });
  // Search: submitting (the keyboard's Search key) is a filter change →
  // Loading, keeping the current filters (flows.md Flow 1).
  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = withRun(readForm());
  });

  // Result count, in the same words whether it's a search, filters or both.
  function countText(n, f) {
    var filtered = f.region || f.sports.length || datesFiltered(f);
    var what = f.q ? '“' + f.q + '”' + (filtered ? ' and your filters' : '') : 'your filters';
    return '<strong>' + n + '</strong> ' + (n === 1 ? 'race matches ' : 'races match ') + what;
  }

  // --- Success page with filters applied: show only the matching sample
  // races (real markup, un-hidden or hidden) and the filtered count.
  var cards = document.querySelectorAll('.race-list .race-card');
  if (cards.length && hasFilterParams(params)) {
    var keep = matches(readForm()).map(function (r) { return r.slug; });
    cards.forEach(function (card) {
      var slug = new URLSearchParams(card.querySelector('a').search).get('race');
      card.parentNode.hidden = keep.indexOf(slug) === -1;
    });
    document.querySelector('.results-count').innerHTML = countText(keep.length, readForm());
  }

  // --- Error page: "Try again" re-runs the same fetch, keeping filters
  // (FetchError → Retry? yes → Loading).
  document.querySelectorAll('[data-retry]').forEach(function (a) { a.href = withRun(readForm()); });

  // --- Loading page: only when reached through the flow (?run=1) — opened
  // on its own (e.g. from index.html) it stays put for inspection. After a
  // short fetch delay it takes one of flows.md's three exits: connection
  // fails → FetchError; no matches → Empty; otherwise → Race browse with
  // the results. A static wireframe can't make a real fetch fail (offline,
  // the next page wouldn't load either), so "connection fails" is taken
  // when the browser reports offline or the URL carries the test switch
  // &fail=1 (_conventions.md § 2).
  if (document.body.getAttribute('data-state') === 'loading' && params.get('run') === '1') {
    window.setTimeout(function () {
      var f = readForm();
      var q = toParams(f).toString();
      var failed = !navigator.onLine || params.get('fail') === '1';
      var next = failed ? 'race-browse-error.html'
        : matches(f).length === 0 ? 'race-browse-empty.html'
        : 'race-browse.html';
      window.location.replace(next + (q ? '?' + q : ''));
    }, 1200);
  }

  // --- List/Map toggle. Swaps the visible panel, and hides the results
  // row's list-only parts (Sort, and "upcoming" in the count) in Map.
  var viewButtons = document.querySelectorAll('.view-btn');
  var panels = {
    list: document.getElementById('list-view'),
    map: document.getElementById('map-view')
  };
  var listOnly = document.querySelectorAll('[data-list-only]');
  viewButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.getAttribute('data-view');
      viewButtons.forEach(function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (key) {
        panels[key].hidden = key !== view;
      });
      listOnly.forEach(function (el) {
        el.hidden = view !== 'list';
      });
    });
  });
})();
</script>

<script>
/* Signed in? (flows.md) — the auth session is modeled as a sessionStorage
   flag (_conventions.md § 2). Links to owner-only screens carry
   data-requires-auth; signed out, they go to the sign-in gate instead,
   carrying where to land after. Pages never redirect themselves. */
(function () {
  function signedIn() {
    try { return sessionStorage.getItem('onrace-signed-in') === '1'; } catch (e) { return false; }
  }
  document.querySelectorAll('a[data-requires-auth]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (signedIn()) return;
      e.preventDefault();
      location.href = 'sign-in-sign-up.html?next=' + encodeURIComponent(a.getAttribute('href'));
    });
  });
})();
</script>

</body>
</html>
