<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New password (Loading) — Onrace (wireframe)</title>
<!--
  New password — [INFRASTRUCTURE], no job (sitemap.md → Entities → 5:
  email + password sign-in needs a way back in). flows.md → Flow 6 — Reset
  password: opening the emailed reset link → "Reset link valid?" → yes,
  recovery session started → NewPassword (this page) → "taps Save" →
  PwChecks → SavingPw (new-password-loading.html) → "Password updated?".
  _screens.md → Pass 2 → New password. Base page = the blank form (Empty is
  "—": the blank form is the base). Files: new-password.html, -error
  (?cause=short|mismatch|same|submit|expired), -loading.
-->
<style>
  /* STATE: loading — same structure and zones as new-password.html; only
     the content inside them changes (_conventions.md § 5). flows.md →
     Flow 6 → SavingPw, "Loading: saving new password" (_screens.md → New
     password → Loading ✓: form locked, button "Saving…"). */

  /* Structure/hierarchy/zones + real interaction only — grayscale, no color,
     no custom fonts, no shadows, no content icons (system-chrome glyphs
     only: the back chevron — _conventions.md § 1). Deferred per
     _conventions.md § 7. Bare screen (_conventions.md § 1): index.html
     provides the device frame and nav tree.

     A step inside the Sign in gate (_conventions.md § 1, "Inside a gate,
     steps drill down"): it pushes inside the modal, so the top bar holds
     "‹ Sign in" (the parent's title, shortened because the bar also holds
     the centred title, § 1 → Back navigation) and the title "New
     password". No tab bar. The gate's rule for the primary action applies:
     Save new password sits at the end of the form, in the content flow, not
     in the top bar's trailing slot and not in a sticky bottom bar. The body
     is a flex column: the top bar sits above the scrolling .phone-screen. */

  /* Softer iOS-style grayscale (_conventions.md § 1). Radii: --r-sm for
     small controls (inputs), --r for large surfaces (primary button). */
  :root {
    --ink: #1c1c1e;          /* primary text (iOS label) */
    --ink-2: #6c6c70;        /* secondary text */
    --ink-3: #8e8e93;        /* tertiary: placeholder */
    --line: #c6c6c8;         /* borders, separators */
    --line-strong: #8e8e93;  /* emphasized border (alert) */
    --fill-strong: #3a3a3c;  /* current / pressed / primary action */
    --fill-soft: #f2f2f7;    /* placeholder regions, alert background */
    --fill-track: #e9e9eb;
    --skeleton: #e5e5ea;
    --r-sm: 8px;
    --r: 12px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0 auto;
    max-width: 390px;
    color: var(--ink);
    background: #fff;
    line-height: 1.4;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--ink); }
  [hidden] { display: none !important; }

  /* --- top bar: back (leading) + centred title. iOS navigation bar
     metrics; system chrome = system font. Back link and chevron exactly as
     log-result.html. --- */
  .top-bar {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    flex: none;
    position: relative;
    display: flex;
    align-items: center;
    height: 44px;
    padding: 0 8px;
    background: #fff;
    border-bottom: 0.5px solid var(--line);
    font-size: 17px;
  }
  .top-bar a {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    color: var(--fill-strong);
    text-decoration: none;
  }
  .back-chevron { display: block; }
  .bar-title {
    position: absolute;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    pointer-events: none;
  }

  .phone-screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .gate { padding: 20px 16px 32px; }
  .context { margin: 0 0 20px 0; font-size: 0.95rem; color: var(--ink-2); }

  /* --- the form: label above each field, full-width inputs. --- */
  fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
  .field { margin: 0 0 16px 0; }
  .field label { display: block; font-size: 0.85rem; color: var(--ink-2); margin: 0 0 6px 0; }
  .field input {
    display: block;
    width: 100%;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 0 12px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }
  .field input::placeholder { color: var(--ink-3); }
  .field input:disabled { background: var(--fill-soft); color: var(--ink-2); }
  .hint { margin: 6px 0 0 0; font-size: 0.8rem; color: var(--ink-2); }

  .submit-btn {
    display: block;
    width: 100%;
    margin: 8px 0 0 0;
    border: 1px solid var(--line);
    background: var(--fill-strong);
    color: #fff;
    padding: 12px 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    border-radius: var(--r);
    cursor: pointer;
  }
  .submit-btn:disabled { cursor: default; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body role="application" aria-label="Onrace — New password, loading state (wireframe)">

  <!-- ZONE: top bar — iOS navigation bar inside the Sign in gate
       (_conventions.md § 1, "Inside a gate, steps drill down" and Back
       navigation; _screens.md → New password → Chrome). "‹ Sign in" goes
       back to sign-in-sign-up.html, carrying ?next: flows.md → Flow 6,
       NewPassword → "cancels" → BackToSignIn. Going back abandons the
       reset (DeadEnd12, "reset never completed", if they never return).
       No tab bar. The title "New password" is centred in the bar. It
       stays usable while saving: leaving doesn't depend on the request. -->
  <header class="top-bar">
    <a href="sign-in-sign-up.html" data-back><svg class="back-chevron" aria-hidden="true" width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sign in</span></a>
    <h1 class="bar-title">New password</h1>
  </header>

  <div class="phone-screen">
    <main class="gate">

      <!-- ZONE: what this is — one line. The recovery session exists
           (flows.md → Flow 6, ResetLinkValid → yes), so the person is
           setting a password, not asking for a link. -->
      <p class="context">Choose a new password for your Onrace account.</p>

      <!-- ZONE: new password form, locked — SavingPw (flows.md → Flow 6;
           _screens.md → New password → Loading). The same fields in place,
           locked (fieldset disabled); the button itself says what's
           happening. No password reached this page (passwords never travel
           in the URL, _conventions.md § 2), so the fields hold a masked
           placeholder value, not what was typed. The hint "At least 8
           characters." is [?] (flows.md → PwChecks: Onrace's chosen
           Supabase minimum; Supabase's default is 6). -->
      <form id="pw-form" aria-busy="true" novalidate>
        <fieldset disabled>
          <div class="field">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" autocomplete="new-password" aria-describedby="new_password-hint" required placeholder="••••••••" aria-label="Password, hidden while it sends">
            <p class="hint" id="new_password-hint">At least 8 characters.</p>
          </div>
          <div class="field">
            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required placeholder="••••••••" aria-label="Password, hidden while it sends">
          </div>
          <button type="submit" class="submit-btn">Saving…</button>
        </fieldset>
        <!-- ZONE: status — "Loading: saving new password" for assistive
             tech (visually hidden, role="status"), as on
             sign-in-sign-up-loading.html. -->
        <p class="visually-hidden" role="status">Saving your new password…</p>
      </form>

    </main>
  </div><!-- /.phone-screen -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  // ?next=, same allowlist as sign-in-sign-up.html: owner-only screens only.
  var next = params.get('next') || '';
  if (!/^(results-list[a-z-]*|log-result[a-z-]*|result-detail[a-z-]*|profile(-loading)?)\.html(\?[^#]*)?$/.test(next)) next = '';
  // email rides along too (_critique.md #8), so Sign in is pre-filled after
  // the reset; checked loosely and only ever used as a URL value.
  var em = new URLSearchParams(window.location.search).get('email') || '';
  if (!/^[^\s@<>"]+@[^\s@<>"]+$/.test(em)) em = '';
  var nq = [next ? 'next=' + encodeURIComponent(next) : '', em ? 'email=' + encodeURIComponent(em) : '']
    .filter(Boolean).join('&');

  // "‹ Sign in" keeps ?next.
  document.querySelector('[data-back]').href = 'sign-in-sign-up.html' + (nq ? '?' + nq : '');

  // Only when reached through the flow (?run=1, set by Save): after a short
  // delay, take one of "Password updated?"'s exits (flows.md → Flow 6).
  // Opened on its own (e.g. from index.html) it stays put for inspection.
  // Test switches (_conventions.md § 2), nothing rendered for them:
  //   offline or &fail=1 → PwSaveError: new-password-error.html?cause=submit
  //   &same=1            → SameError:   new-password-error.html?cause=same
  if (params.get('run') !== '1') return;
  window.setTimeout(function () {
    if (!navigator.onLine || params.get('fail') === '1') {
      window.location.replace('new-password-error.html?cause=submit' + (nq ? '&' + nq : ''));
      return;
    }
    if (params.get('same') === '1') {
      window.location.replace('new-password-error.html?cause=same' + (nq ? '&' + nq : ''));
      return;
    }
    // Success6: password changed. Onrace then ends the recovery session on
    // this device (local sign-out; the session lives in sessionStorage,
    // _conventions.md § 2) and lands on Sign in with a confirmation
    // (?reset=done, _screens.md → Sign in / Sign up changes), next kept.
    try { window.sessionStorage.removeItem('onrace-signed-in'); } catch (err) {}
    window.location.replace('sign-in-sign-up.html?reset=done' + (nq ? '&' + nq : ''));
  }, 1200);
})();
</script>

</body>
</html>
