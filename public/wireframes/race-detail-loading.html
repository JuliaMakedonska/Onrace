<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race detail (Loading) — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=694b17fc">
</head>
<body class="onrace">

  <div class="phone-screen">

      <!-- ZONE: top bar — back to Race browse, the only navigation on this
           drill-down screen (no global tab bar, _conventions.md § 1). This
           is flows.md's "back / compares another race" edge, and the "no"
           edge of WantsToEnter: not worth entering → back to browsing. -->
      <header class="top-bar" aria-label="Back" data-collapse>
        <a class="back" href="race-browse.html"><span>Discover</span></a>
        <span class="bar-title" aria-hidden="true"></span>
      </header>

    <main>

      <!-- ZONE: race — Loading state (flows.md: DetailLoading, "fetching race
           details", on tapping a card/pin in Race browse). Gray bars sit in
           the same zones as a loaded race; hidden from assistive tech, with
           aria-busy plus the visually-hidden status carrying the meaning.
           The "Discover" back link stays usable — it doesn't depend on the fetch. -->
      <article class="race" aria-busy="true">
        <h1 class="visually-hidden">Race details</h1>   <!-- heading navigation finds the screen while it loads (step 7, #9) -->
        <p class="visually-hidden" role="status">Loading race details…</p>
        <div aria-hidden="true">
          <div class="bar photo"></div>
          <div class="bar h1"></div>
          <div class="skel-facts">
            <div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div>
          </div>
          <div class="bar h2"></div>
          <div class="bar line"></div>
          <div class="bar line end"></div>
          <div class="bar h2"></div>
          <div class="bar link"></div>
        </div>
      </article>

    </main>

    <!-- ZONE: sticky action bar — shown from the first frame with a gray
         placeholder where Register will be (not a disabled button: nothing
         to tap yet), so the layout doesn't jump when the race arrives. -->
    <div class="action-bar" aria-hidden="true">
      <div class="bar button"></div>
      <div class="bar caption"></div>
    </div>

  </div><!-- /.phone-screen -->

<script>
/* Back keeps Race browse as it was (step 6, #2): its filters, search and view ride along as ?back=…, and every link
   inside this drill-down passes them on. */
(function () {
  var back = new URLSearchParams(window.location.search).get('back');
  if (!back) return;
  var a = document.querySelector('.top-bar a[href="race-browse.html"]');
  if (a) a.href = 'race-browse.html?' + back;
  document.querySelectorAll('a[href^="race-detail"]').forEach(function (l) {
    var u = new URLSearchParams(l.search); u.set('back', back); l.setAttribute('href', l.getAttribute('href').split('?')[0] + '?' + u.toString());
  });
})();
</script>
<script>
(function () {
  // Only when reached through the flow (a race card on Race browse, or
  // DetailError's "Try again" — both pass ?race=): after a short fetch delay,
  // take one of flows.md's two DetailLoading exits. Opened on its own (e.g.
  // from index.html) it stays put for inspection. "Connection fails" is
  // taken when the browser reports offline or the URL carries the test
  // switch &fail=1 (_conventions.md § 2).
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('race');
  if (['berlin-marathon', 'hyrox-london', 'hyrox-dallas', 'deka-strong-chicago', 'boston-marathon', 'spartan-beast-killington', 'utmb'].indexOf(slug) === -1) return;
  window.setTimeout(function () {
    var failed = !navigator.onLine || params.get('fail') === '1';
    window.location.replace((failed ? 'race-detail-error.html' : 'race-detail.html') + '?race=' + slug + (params.get('back') ? '&back=' + encodeURIComponent(params.get('back')) : ''));
  }, 1000);
})();
</script>

<script>
/* The collapsing title (markup pass; G4 on the tab screens, G34/G53 on the detail screens): the top bar's small
   title appears once the page's h1 has scrolled away, and goes when it comes back (HIG Toolbars, large titles). */
(function () {
  var bar = document.querySelector('.top-bar[data-collapse]');
  var screen = document.querySelector('.phone-screen');
  if (!bar || !screen || !('IntersectionObserver' in window)) return;
  if (!bar.classList.contains('top-bar--large')) {   // a drill-down's bars at the scroll edge (step 6, #27): glass only once content runs under them
    var actionBars = screen.querySelectorAll('.action-bar');   // one per race or result; the shown one counts
    var edges = function () {
      bar.classList.toggle('is-scrolled', screen.scrollTop > 0);
      var atEnd = screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 1;
      actionBars.forEach(function (ab) { ab.classList.toggle('is-at-end', atEnd); });
    };
    screen.addEventListener('scroll', edges, { passive: true });
    window.addEventListener('resize', edges);
    edges();
  }
  var h1 = Array.prototype.filter.call(screen.querySelectorAll('main h1'), function (h) { return h.getClientRects().length && !h.classList.contains('visually-hidden'); })[0];   // a hidden heading (a loading state's) has no title to collapse into the bar
  if (!h1) return;
  var title = bar.querySelector('.bar-title');
  if (title && !title.textContent.trim()) title.textContent = h1.textContent;
  var inFlow = !bar.classList.contains('top-bar--large');   // a drill-down's bar takes space: the h1 hides under it sooner
  new IntersectionObserver(function (entries) {
    bar.classList.toggle('is-collapsed', entries[0].intersectionRatio < 0.5);   // mostly gone under the bar, as iOS
  }, { root: screen, rootMargin: (inFlow ? -bar.offsetHeight : 0) + 'px 0px 0px 0px', threshold: [0, 0.5, 1] }).observe(h1);
})();
</script>

</body>
</html>
