<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile (Loading) — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=1b2fadee">
</head>
<body class="onrace" data-state="loading" role="application" aria-label="Onrace — Profile, loading state (wireframe)">

  <div class="phone-screen">

    <!-- ZONE: top bar (markup pass, G4): floats over the large title, empty at rest; once the h1 has scrolled away
         it turns to glass and shows the small title. -->
    <div class="top-bar top-bar--large" data-collapse>
      <span class="bar-title" aria-hidden="true">Profile</span>
    </div>

    <main>

      <header>
        <h1>Profile</h1>
      </header>

      <!-- ZONE: loading state (_screens.md → Profile → Loading; flows.md
           Flow 5 ProfileLoading "fetching profile") — fires on every tap of
           the Profile tab and on Try again from the load error. Every zone
           of profile.html is a gray placeholder in its own place: the
           initials circle, the name and email lines, the Account group's
           four rows, and the Sign out row — so nothing jumps when the
           profile arrives. Sign out isn't live yet: the account it would
           sign out of hasn't loaded. Placeholders are hidden from assistive
           tech; aria-busy plus the visually-hidden status carry the
           meaning. The tab bar works throughout. -->
      <div aria-busy="true" aria-live="polite">
        <p class="visually-hidden">Loading your account…</p>
        <div aria-hidden="true">
          <div class="identity">
            <div class="initials skel"></div>
            <div class="bar name"></div>
            <div class="bar email"></div>
          </div>
          <div class="group">
            <div class="bar heading"></div>
            <ul class="rows">
            <li><div class="row"><div class="bar label"></div><div class="bar value"></div></div></li>
            <li><div class="row"><div class="bar label"></div><div class="bar value"></div></div></li>
            <li><div class="row"><div class="bar label"></div><div class="bar value"></div></div></li>
            <li><div class="row"><div class="bar label"></div><div class="bar value"></div></div></li>
            </ul>
          </div>
          <div class="group">
            <div class="skel-signout"><div class="bar"></div></div>
          </div>
        </div>
      </div>

    </main>

  </div><!-- /.phone-screen -->

  <!-- ZONE: global nav — 3 tabs, all destinations (sitemap.md → Navigation
       § 1, revised 2026-09-25): Discover / My Results / Profile, Profile
       current here (_conventions.md § 1). My Results and Profile are
       owner-only and carry data-requires-auth (the snippet at the end of
       this file; flows.md Flow 5 "Signed in?"). Both go through their
       loading page, since each screen's fetch runs on every visit
       (flows.md Flows 3 and 5). Works in every Profile state, and is the
       "no" edge out of ProfileError's Retry? (DeadEnd10). -->
  <nav class="bottom-nav" aria-label="Global navigation">
    <ul>
      <li><a href="race-browse.html"><span>Discover</span></a></li>
      <li><a href="results-list-loading.html?run=1" data-requires-auth><span>Results</span></a></li>
      <li><a href="profile-loading.html?run=1" aria-current="page" data-requires-auth><span>Profile</span></a></li>
    </ul>
  </nav>

<script>
(function () {
  // Shared by profile.html, profile-loading.html and profile-error.html.
  // Wires flows.md → "Flow 5 — Profile and sign out":
  //   ProfileLoading → loads → Profile · connection fails → ProfileError
  //   ProfileError → Retry? yes → ProfileLoading (Try again link)
  //   Profile → changes a field → SavingField → Saved? yes → Profile
  //                                                  no → SaveError
  //   SaveError → tries again → SavingField · leaves it → Profile
  //   Profile → Sign out → Confirm dialog → Cancel → Profile
  //                                       → Sign out → Success5 (Race browse)
  var params = new URLSearchParams(window.location.search);
  var state = document.body.getAttribute('data-state'); // loading | error | (base)
  var FIELDS = ['name', 'country', 'language'];
  // "Connection fails" can't really happen in a static wireframe, so it's
  // the browser reporting offline or the reviewer's &fail=1 switch
  // (_conventions.md § 2). Nothing about it is rendered in the screen.
  function connectionFails() { return !navigator.onLine || params.get('fail') === '1'; }

  // --- Loading page: moves on only when reached through the flow (?run=1);
  // opened on its own (e.g. from index.html) it stays put for inspection.
  if (state === 'loading') {
    if (params.get('run') === '1') {
      window.setTimeout(function () {
        window.location.replace(connectionFails() ? 'profile-error.html' : 'profile.html');
      }, 1000);
    }
    return;
  }

  // --- Error page: two causes on one page (_conventions.md § 5). Both are
  // real markup; this un-hides the one the URL names. Default = load.
  var field = null;
  if (state === 'error') {
    var cause = params.get('cause') === 'save' ? 'save' : 'load';
    document.getElementById('cause-load').hidden = cause !== 'load';
    document.getElementById('cause-save').hidden = cause !== 'save';
    if (cause === 'load') return; // nothing loaded: no fields, no Sign out to wire
    field = FIELDS.indexOf(params.get('field')) >= 0 ? params.get('field') : 'name';
  }

  function setValue(el, v) {
    if (el.tagName === 'SELECT') {
      for (var i = 0; i < el.options.length; i++) {
        if (el.options[i].text === v) { el.selectedIndex = i; return true; }
      }
      return false;
    }
    el.value = v;
    return true;
  }
  function showIdentity(name) {
    document.getElementById('profile-name').textContent = name || 'Maya Rossi';
    var initials = (name || '').trim().split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase();
    document.getElementById('profile-initials').textContent = initials || 'MR';
  }

  // SaveError: the named field shows its previous value and says so; Try
  // again carries the attempted value back to profile.html.
  if (field) {
    var fEl = document.getElementById(field);
    var prev = params.get('prev');
    if (prev !== null) setValue(fEl, prev);
    if (field === 'name') showIdentity(fEl.value);
    var err = document.getElementById(field + '-error');
    err.querySelector('[data-prev]').textContent = fEl.value;
    var attempted = params.get('value');
    if (attempted !== null) {
      err.querySelector('[data-retry]').href = 'profile.html?retry=' + field + '&value=' + encodeURIComponent(attempted);
    }
    err.hidden = false;
  }

  // --- Save as you go. Last saved value per field, so a failed save can
  // say what the field went back to.
  var saved = {};
  var timers = {};
  FIELDS.forEach(function (f) { saved[f] = document.getElementById(f).value; });

  function save(f) {
    var el = document.getElementById(f);
    var note = document.getElementById(f + '-status');
    var saving = note.querySelector('[data-saving]');
    var done = note.querySelector('[data-saved]');
    var errNote = document.getElementById(f + '-error');
    if (errNote) errNote.hidden = true; // a new attempt replaces the old error
    window.clearTimeout(timers[f]);
    saving.hidden = false; done.hidden = true; note.hidden = false;
    timers[f] = window.setTimeout(function () {
      if (connectionFails()) {
        window.location.href = 'profile-error.html?cause=save&field=' + f +
          '&value=' + encodeURIComponent(el.value) + '&prev=' + encodeURIComponent(saved[f]);
        return;
      }
      saved[f] = el.value;
      if (f === 'name') showIdentity(el.value);
      saving.hidden = true; done.hidden = false;
      timers[f] = window.setTimeout(function () { note.hidden = true; }, 2000);
    }, 700);
  }
  FIELDS.forEach(function (f) {
    document.getElementById(f).addEventListener('change', function () { save(f); });
  });

  // Arriving from SaveError's Try again: re-apply the attempted change and
  // save it again (SaveError → "tries the change again" → SavingField).
  var retry = params.get('retry');
  if (state !== 'error' && FIELDS.indexOf(retry) >= 0 && params.get('value') !== null) {
    if (setValue(document.getElementById(retry), params.get('value'))) save(retry);
  }

  // --- Sign out: confirm first (iOS alert), then clear the session.
  var alertEl = document.getElementById('signout-alert');
  var cancelBtn = document.getElementById('signout-cancel');
  document.getElementById('sign-out').addEventListener('click', function () {
    alertEl.showModal();
    cancelBtn.focus();
  });
  cancelBtn.addEventListener('click', function () { alertEl.close(); });
  document.getElementById('signout-confirm').addEventListener('click', function () {
    try { sessionStorage.removeItem('onrace-signed-in'); } catch (e) {}
    location.href = 'race-browse.html';
  });
})();
</script>

<script>
/* Signed in? (flows.md) — the auth session is modeled as a sessionStorage
   flag (_conventions.md § 2). Links to owner-only screens carry
   data-requires-auth; signed out, they go to the sign-in gate instead,
   carrying where to land after. Pages never redirect themselves. */
(function () {
  function signedIn() {
    try { return sessionStorage.getItem('onrace-signed-in') === '1'; } catch (e) { return false; }
  }
  document.querySelectorAll('a[data-requires-auth]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (signedIn()) return;
      e.preventDefault();
      location.href = 'sign-in-sign-up.html?next=' + encodeURIComponent(a.getAttribute('href'));
    });
  });
})();
</script>

<script>
/* The collapsing title (markup pass; G4 on the tab screens, G34/G53 on the detail screens): the top bar's small
   title appears once the page's h1 has scrolled away, and goes when it comes back (HIG Toolbars, large titles). */
(function () {
  var bar = document.querySelector('.top-bar[data-collapse]');
  var screen = document.querySelector('.phone-screen');
  if (!bar || !screen || !('IntersectionObserver' in window)) return;
  var h1 = Array.prototype.filter.call(screen.querySelectorAll('main h1'), function (h) { return h.getClientRects().length; })[0];
  if (!h1) return;
  var title = bar.querySelector('.bar-title');
  if (title && !title.textContent.trim()) title.textContent = h1.textContent;
  var inFlow = !bar.classList.contains('top-bar--large');   // a drill-down's bar takes space: the h1 hides under it sooner
  new IntersectionObserver(function (entries) {
    bar.classList.toggle('is-collapsed', entries[0].intersectionRatio < 0.5);   // mostly gone under the bar, as iOS
  }, { root: screen, rootMargin: (inFlow ? -bar.offsetHeight : 0) + 'px 0px 0px 0px', threshold: [0, 0.5, 1] }).observe(h1);
})();
</script>

</body>
</html>
