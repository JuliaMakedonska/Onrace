<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results list (Empty) — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../tokens/tokens.css?v=83258959">
<link rel="stylesheet" href="../components/index.css?v=83258959">
<script src="../tokens/theme.js"></script>
</head>
<body class="onrace">

  <div class="phone-screen">

    <!-- ZONE: top bar (markup pass, G4): floats over the large title, empty at rest; once the h1 has scrolled away
         it turns to glass and shows the small title. -->
    <header class="top-bar top-bar--large" data-collapse>
      <span class="bar-title" aria-hidden="true">Results</span>
      <!-- Log result: the screen's primary action, a text button at the bar's trailing edge (G5). Hidden in the
           empty state, where "Log your first result" is the one way in (designer, 2026-10-23). -->
      <a class="bar-action" href="log-result.html" hidden>Log result</a>
    </header>

    <main>

      <!-- ZONE: header — iOS large title "My Results" plus the Log result
           action (_screens.md → Pass 2 → Results list → Chrome;
           sitemap.md → Navigation § 3: "the primary button in the Results
           list header"). It's the entry to Related Job 3 (flows.md:
           ResultsList → "Finds and taps Log result?" [?] → Log result), and
           it's part of the header, not of the loaded list, so it's present
           and working in every state — loading and error included (flows.md,
           Related Job 3 decisions and the 2026-09-24 revision note). -->
      <header>
        <h1>Results</h1>
      </header>

      <!-- ZONE: results row — the count row, as on the base page. Hidden in this state (2026-09-30, `_critique.md` #9): the empty
           state's heading already says it ("No races match…"), so a count
           line above it only repeated the message. -->
      <div class="results-row" hidden>
        <p class="results-count" aria-live="polite"></p>
      </div>

      <!-- ZONE: empty state (_screens.md → Results list → Empty; flows.md
           HasLogged → "no" → Empty2 "no results logged yet"). A legitimate
           data state, not an error — so no retry. Copy says what the archive
           is for (official results, each with its source link, as proof for
           e.g. an elite-race application — ../CLAUDE.md → Result trust model;
           research/jtbd.md → Related Job 4). "Log your first result" is the
           "goes to log one instead" edge → Log result (the empty state's call
           to action, sitemap.md → Navigation § 3). "Gives up" (DeadEnd4) is
           just leaving by a tab — no button. -->
      <section id="list-view" aria-label="Results archive">
        <div class="state-message state-message--archive" role="status">
          <h2>No results logged yet</h2>
          <p>Keep your official race results here.</p>
          <div class="state-actions">
            <a class="state-action" href="log-result.html">Log your first result</a>
          </div>
        </div>
      </section>

    </main>

  </div><!-- /.phone-screen -->

  <!-- ZONE: global nav — 3 tabs, all destinations (sitemap.md → Navigation
       § 1, revised 2026-09-25): Discover / My Results / Profile, with
       My Results current on this screen (_conventions.md § 1). "Log result"
       is not a tab: it's the header action above, since tabs are for places
       and actions are buttons. -->
  <nav class="bottom-nav" aria-label="Global navigation">
    <ul>
      <li><a href="race-browse.html"><span>Discover</span></a></li>
      <!-- My Results and Profile are owner-only: data-requires-auth sends a
           signed-out person to the Sign in / Sign up gate first (flows.md
           "Signed in?"; the snippet at the end of this file). Re-tapping
           My Results re-runs the archive fetch (flows.md: ResultsList →
           Loading2). -->
      <li><a href="results-list-loading.html?run=1" aria-current="page" data-requires-auth><span>Results</span></a></li>
      <li><a href="profile-loading.html?run=1" data-requires-auth><span>Profile</span></a></li>
    </ul>
  </nav>

<script>
(function () {
  // Shared by results-list.html and its three state pages. Wires the
  // Results list half of flows.md → "Related Job 4 — Retrieve Proof":
  //   ResultsList → Loading2 → HasLogged? yes → ResultsList · no → Empty2
  //   Loading2 → "connection fails" → FetchError2 → Retry? yes → Loading2
  //   ResultsList → "taps a logged entry" → DetailLoading2
  // plus Related Job 3's landing: Log result's success → ResultsList
  // with ?saved=<race name>.
  var params = new URLSearchParams(window.location.search);

  // --- Saved confirmation: real markup, un-hidden only when Log result's
  // success sent the saved race's name along.
  var saved = params.get('saved');
  var savedStatus = document.querySelector('.saved-status');
  if (savedStatus && saved) {
    savedStatus.querySelector('[data-saved-name]').textContent = saved;
    // revealed a moment after load, inside a live region that already exists, so screen readers announce it
    window.setTimeout(function () { savedStatus.hidden = false; }, 150);
  }

  // --- Loading page: only when reached through the flow (?run=1) — opened
  // on its own (e.g. from index.html) it stays put for inspection. After a
  // short fetch delay it takes one of flows.md's three exits: connection
  // fails → FetchError2; no results logged yet → Empty2; otherwise →
  // Results list. A static wireframe can't make a real fetch fail, or vary
  // whether anything is logged, so the error branch is taken when the
  // browser reports offline or the URL carries &fail=1, and the empty
  // branch on &empty=1 (_conventions.md § 2). ?saved= is carried through
  // to the populated list.
  if (document.body.getAttribute('data-state') === 'loading' && params.get('run') === '1') {
    window.setTimeout(function () {
      var failed = !navigator.onLine || params.get('fail') === '1';
      var next = failed ? 'results-list-error.html'
        : params.get('empty') === '1' ? 'results-list-empty.html'
        : 'results-list.html' + (saved ? '?saved=' + encodeURIComponent(saved) : '');
      window.location.replace(next);
    }, 1200);
  }
})();
</script>

<script>
/* Signed in? (flows.md) — the auth session is modeled as a sessionStorage
   flag (_conventions.md § 2). Links to owner-only screens carry
   data-requires-auth; signed out, they go to the sign-in gate instead,
   carrying where to land after. Pages never redirect themselves. */
(function () {
  function signedIn() {
    try { return sessionStorage.getItem('onrace-signed-in') === '1'; } catch (e) { return false; }
  }
  document.querySelectorAll('a[data-requires-auth]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (signedIn()) return;
      e.preventDefault();
      location.href = 'sign-in-sign-up.html?next=' + encodeURIComponent(a.getAttribute('href'));
    });
  });
})();
</script>

<script>
/* The collapsing title (markup pass; G4 on the tab screens, G34/G53 on the detail screens): the top bar's small
   title appears once the page's h1 has scrolled away, and goes when it comes back (HIG Toolbars, large titles). */
(function () {
  var bar = document.querySelector('.top-bar[data-collapse]');
  var screen = document.querySelector('.phone-screen');
  if (!bar || !screen || !('IntersectionObserver' in window)) return;
  var h1 = Array.prototype.filter.call(screen.querySelectorAll('main h1'), function (h) { return h.getClientRects().length && !h.classList.contains('visually-hidden'); })[0];   // a hidden heading (a loading state's) has no title to collapse into the bar
  if (!h1) return;
  var title = bar.querySelector('.bar-title');
  if (title && !title.textContent.trim()) title.textContent = h1.textContent;
  var inFlow = !bar.classList.contains('top-bar--large');   // a drill-down's bar takes space: the h1 hides under it sooner
  new IntersectionObserver(function (entries) {
    bar.classList.toggle('is-collapsed', entries[0].intersectionRatio < 0.5);   // mostly gone under the bar, as iOS
  }, { root: screen, rootMargin: (inFlow ? -bar.offsetHeight : 0) + 'px 0px 0px 0px', threshold: [0, 0.5, 1] }).observe(h1);
})();
</script>

</body>
</html>
