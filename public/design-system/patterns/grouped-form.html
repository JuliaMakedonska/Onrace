<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouped form · Onrace pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../index.css?v=eaa418cd">
<script src="../tokens/theme.js"></script>
</head>
<!-- PATTERN: Grouped form (design-system/patterns/README.md). Composed only of existing components: this page links
     design-system/index.css and nothing else, has no style block, no inline style and no class the components don't
     define (scripts/check_kit.py stops the build otherwise).
     Stands on: Log result, Sign in / Sign up (Create account), New password, Profile, and since 2026-11-06 Results list and
     Result detail (the Add official result link sheet): .group > .rows of labelled
     fields, every row one height (--grouped-row-min, 52px, 2026-11-07), with .group-footer under the group for the hint, and a
     .field-error under the group, outside its surface, for a field that needs fixing.
     Composed of: Text field, Field hint, Field error (on Profile, Grouped settings rows); on the sign-in screens, Gate layout. Drawn here as New password with the
     passwords not matching: the error sits under the group, outside its surface, and replaces only Confirm new
     password's helper, so New password's "At least 8 characters." stays.
     Shown live on design-system/docs/patterns.html and specimens.html → Patterns, in a frame that loads this file. -->
<body class="onrace">
  <header class="top-bar">
    <a class="back" href="../../wireframes/sign-in-sign-up.html"><span>Sign in</span></a>
    <h1 class="bar-title">New password</h1>
    <button type="submit" form="pw-form" class="bar-action">Save<span class="visually-hidden"> new password</span></button>
  </header>
  <div class="phone-screen">
    <main class="gate">
      <p class="context">Choose a new password for your Onrace account.</p>
      <form id="pw-form" class="form-rows" novalidate>
        <fieldset>
          <div class="group">
            <ul class="rows">
              <li><div class="row"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" autocomplete="new-password" aria-describedby="new_password-hint" required placeholder="Required"></div></li>
              <li><div class="row"><label for="confirm_password">Confirm new password</label><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required placeholder="Required" aria-invalid="true" aria-describedby="confirm_password-error-mismatch"></div></li>
            </ul>
            <p class="field-error" id="confirm_password-error-mismatch">The passwords don’t match. Enter the same password in both fields.</p>
            <p class="group-footer" id="new_password-hint">At least 8 characters.</p>
          </div>
        </fieldset>
      </form>
    </main>
  </div>
</body>
</html>
