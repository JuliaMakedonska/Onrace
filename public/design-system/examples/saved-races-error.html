<!-- EXAMPLE: Saved races, error (design-system/examples/README.md). A test of the system with a screen the product
     doesn't have (research/jtbd.md → Related job 2, the Multi-Region Season Planner): built only from design-system/,
     the Pushed screen pattern and the Empty or error state pattern, with no style of its own and every word in microcopy.md (rows 584–594). Not a
     product screen: not in the tab bar, the viewer or flows.md. What the system lacked for it is left out, not drawn,
     and listed in design-system/backlog.md → Examples: Saved races. -->
<body class="onrace">
  <div class="phone-screen">
    <header class="top-bar">
      <a class="back" href="../../wireframes/race-browse.html"><span>Discover</span></a>
      <h1 class="bar-title">Saved races</h1>
    </header>
    <main>
      <div class="state-message" role="alert">
        <h2>Couldn’t load your saved races</h2>
        <p>The connection may have dropped. Check it, then try again. Your saved races haven’t changed.</p>
        <div class="state-actions">
          <a class="state-action" href="saved-races-loading.html" data-retry aria-label="Try again, loading your saved races">Try again</a>
        </div>
      </div>
    </main>
  </div>
</body>
