<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race detail (Loading) — Onrace (wireframe)</title>
<style>
  /* STATE: loading — same structure and zones as race-detail.html; only
     the content inside them changes (_conventions.md § 5). */

  /* Structure/hierarchy/zones + real interaction only — grayscale, no color,
     no custom fonts, no shadows, no icons. Deferred per _conventions.md § 7.
     Bare screen (_conventions.md § 1): index.html provides the device frame
     and nav tree.

     Drill-down screen (_conventions.md § 1, "Drill-down screens"): no global
     tab bar — "Back to races" in the sticky top bar is the only way back —
     and the primary action (Register) sits in a sticky bottom action bar.
     The body is a flex column: the scrolling .phone-screen takes the
     remaining height and the action bar sits below it, outside the scroll,
     so it's always visible and the content never needs padding to clear
     it (the bar's height can change, e.g. when an alert is added). */

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0 auto;
    max-width: 390px;
    color: #000;
    background: #fff;
    line-height: 1.4;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  a { color: #000; }

  .phone-screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* --- top bar: the one way back (Race browse). Sticky inside the scroll
     area; its bottom border is the divider. --- */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #fff;
    border-bottom: 1px solid #000;
    padding: 12px 16px;
    font-size: 0.9rem;
  }

  .race { padding: 20px 16px 28px; }
  .race[hidden] { display: none; }
  .race h1 { font-size: 1.25rem; margin: 0 0 16px 0; }

  /* Key facts keep their field labels here (unlike the shortened cards on
     Race browse): this is where the full field values are read. */
  .facts {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 14px;
    margin: 0 0 24px 0;
    font-size: 0.92rem;
  }
  .facts dt { color: #444; }
  .facts dd { margin: 0; }

  .race h2, .state-message h2, .inline-error h2 { font-size: 0.95rem; margin: 0 0 6px 0; }
  .about p { margin: 0 0 24px 0; font-size: 0.95rem; }
  .official p { margin: 0; font-size: 0.95rem; }

  /* --- sticky action bar: the screen's one primary action, fixed to the
     frame's bottom edge where a top-level screen's tab bar would be. Its
     supporting caption, and any error about the action itself, live in the
     bar with it. --- */
  .action-bar {
    flex: none;
    background: #fff;
    border-top: 2px solid #000;
    padding: 12px 16px 14px;
    z-index: 3;
  }
  .action-bar[hidden] { display: none; }
  .register-btn {
    display: block;
    width: 100%;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
  }
  .action-caption { font-size: 0.78rem; color: #444; margin: 6px 0 0 0; text-align: center; }

  /* --- loading skeletons: gray bars in the same zones as a loaded race
     (name, three facts, about, official site), plus a gray placeholder in
     the action bar where Register will be — so nothing jumps on load.
     Static, no shimmer (_conventions.md § 7). --- */
  .bar { background: #ddd; height: 12px; margin: 0 0 10px 0; }
  .bar.h1 { height: 22px; width: 70%; margin-bottom: 20px; }
  .skel-facts { display: grid; grid-template-columns: 80px 1fr; gap: 10px 14px; margin-bottom: 28px; }
  .skel-facts .bar { margin: 0; }
  .bar.h2 { height: 14px; width: 35%; margin-bottom: 12px; }
  .bar.line { width: 100%; }
  .bar.line.end { width: 65%; margin-bottom: 28px; }
  .bar.link { width: 30%; }
  .bar.button { height: 46px; width: 100%; margin: 0; }
  .bar.caption { height: 10px; width: 60%; margin: 8px auto 0; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body role="application" aria-label="Onrace — Race detail, loading state (wireframe)">

  <div class="phone-screen">

      <!-- ZONE: top bar — back to Race browse, the only navigation on this
           drill-down screen (no global tab bar, _conventions.md § 1). This
           is flows.md's "back / compares another race" edge, and the "no"
           edge of WantsToEnter: not worth entering → back to browsing. -->
      <nav class="top-bar" aria-label="Back">
        <a href="race-browse.html">Back to races</a>
      </nav>

    <main>

      <!-- ZONE: race — Loading state (flows.md: DetailLoading, "fetching race
           details", on tapping a card/pin in Race browse). Gray bars sit in
           the same zones as a loaded race; hidden from assistive tech, with
           aria-busy plus the visually-hidden status carrying the meaning.
           Back to races stays usable — it doesn't depend on the fetch. -->
      <article class="race" aria-busy="true">
        <p class="visually-hidden" role="status">Loading race details…</p>
        <div aria-hidden="true">
          <div class="bar h1"></div>
          <div class="skel-facts">
            <div class="bar"></div><div class="bar" style="width:40%"></div>
            <div class="bar"></div><div class="bar" style="width:55%"></div>
            <div class="bar"></div><div class="bar" style="width:75%"></div>
          </div>
          <div class="bar h2"></div>
          <div class="bar line"></div>
          <div class="bar line end"></div>
          <div class="bar h2"></div>
          <div class="bar link"></div>
        </div>
      </article>

    </main>

  </div><!-- /.phone-screen -->

  <!-- ZONE: sticky action bar — shown from the first frame with a gray
       placeholder where Register will be (not a disabled button: nothing
       to tap yet), so the layout doesn't jump when the race arrives. -->
  <div class="action-bar" aria-hidden="true">
    <div class="bar button"></div>
    <div class="bar caption"></div>
  </div>

<script>
(function () {
  // Only when reached through the flow (a race card on Race browse, or
  // DetailError's "Try again" — both pass ?race=): after a short fetch delay,
  // take one of flows.md's two DetailLoading exits. Opened on its own (e.g.
  // from index.html) it stays put for inspection. "Connection fails" is
  // taken when the browser reports offline or the URL carries the test
  // switch &fail=1 (_conventions.md § 2).
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('race');
  if (['berlin-marathon', 'hyrox-london', 'hyrox-dallas', 'deka-strong-chicago', 'boston-marathon', 'spartan-beast-killington', 'utmb'].indexOf(slug) === -1) return;
  window.setTimeout(function () {
    var failed = !navigator.onLine || params.get('fail') === '1';
    window.location.replace((failed ? 'race-detail-error.html' : 'race-detail.html') + '?race=' + slug);
  }, 1000);
})();
</script>

</body>
</html>
