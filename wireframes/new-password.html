<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New password — Onrace (wireframe)</title>
<!--
  New password — [INFRASTRUCTURE], no job (sitemap.md → Entities → 5:
  email + password sign-in needs a way back in). flows.md → Flow 6 — Reset
  password: opening the emailed reset link → "Reset link valid?" → yes,
  recovery session started → NewPassword (this page) → "taps Save" →
  PwChecks → SavingPw (new-password-loading.html) → "Password updated?".
  _screens.md → Pass 2 → New password. Base page = the blank form (Empty is
  "—": the blank form is the base). Files: new-password.html, -error
  (?cause=short|mismatch|same|submit|expired), -loading.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=d8a5e5e5">
</head>
<body class="onrace">

  <!-- ZONE: top bar — iOS navigation bar inside the Sign in gate
       (_conventions.md § 1, "Inside a gate, steps drill down" and Back
       navigation; _screens.md → New password → Chrome). "‹ Sign in" goes
       back to sign-in-sign-up.html, carrying ?next: flows.md → Flow 6,
       NewPassword → "cancels" → BackToSignIn. Going back abandons the
       reset (DeadEnd12, "reset never completed", if they never return).
       No tab bar. The title "New password" is centred in the bar. -->
  <header class="top-bar">
    <a class="back" href="sign-in-sign-up.html" data-back><span>Sign in</span></a>
    <h1 class="bar-title">New password</h1>
    <button type="submit" form="pw-form" class="bar-action">Save<span class="visually-hidden"> new password</span></button>
  </header>

  <div class="phone-screen">
    <main class="gate">

      <!-- ZONE: what this is — one line. The recovery session exists
           (flows.md → Flow 6, ResetLinkValid → yes), so the person is
           setting a password, not asking for a link. -->
      <p class="context">Choose a new password for your Onrace account.</p>

      <!-- ZONE: new password form — New password + Confirm new password,
           then Save new password at the end of the form (_screens.md → New
           password → Chrome; _conventions.md § 1, the gate's rule for the
           primary action). The hint "At least 8 characters." is [?]:
           flows.md → Flow 6 → PwChecks, 8 is Onrace's chosen Supabase
           project minimum (Supabase's default is 6), not yet set anywhere
           in the docs. Save runs PwChecks client-side before anything is
           sent: under 8 → new-password-error.html?cause=short; the two
           differ → ?cause=mismatch; else → SavingPw
           (new-password-loading.html?run=1). Passwords never travel in the
           URL — the one exception to "state travels in the URL"
           (_conventions.md § 2) — so an error page shows the fields empty
           again. ?next rides along everywhere. -->
      <form id="pw-form" class="form-rows" novalidate>
        <fieldset>
          <div class="group">
            <ul class="rows">
              <li><div class="row"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" autocomplete="new-password" aria-describedby="new_password-hint" required placeholder="Required"></div></li>
              <li><div class="row"><label for="confirm_password">Confirm new password</label><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required placeholder="Required"></div></li>
            </ul>
            <p class="group-footer" id="new_password-hint">At least 8 characters.</p>
          </div>

        </fieldset>
      </form>

    </main>
  </div><!-- /.phone-screen -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  // ?next= is where signing in with the new password will land (flows.md →
  // Flow 6 → Success6: "next is carried through the whole flow"). Same
  // allowlist as sign-in-sign-up.html: owner-only screens only.
  var next = params.get('next') || '';
  if (!/^(results-list[a-z-]*|log-result[a-z-]*|result-detail[a-z-]*|profile(-loading)?)\.html(\?[^#]*)?$/.test(next)) next = '';
  // email rides along too (_critique.md #8), so Sign in is pre-filled after
  // the reset; checked loosely and only ever used as a URL value.
  var em = new URLSearchParams(window.location.search).get('email') || '';
  if (!/^[^\s@<>"]+@[^\s@<>"]+$/.test(em)) em = '';
  var nq = [next ? 'next=' + encodeURIComponent(next) : '', em ? 'email=' + encodeURIComponent(em) : '']
    .filter(Boolean).join('&');

  // "‹ Sign in" keeps ?next.
  document.querySelector('[data-back]').href = 'sign-in-sign-up.html' + (nq ? '?' + nq : '');

  // Save → PwChecks (flows.md → Flow 6), client-side, in order: length,
  // then match. No password is ever put in a URL. Reviewer switches
  // &fail=1 / &same=1 on this page are passed on to the loading page.
  var form = document.getElementById('pw-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = form.elements.new_password.value;
    var confirm = form.elements.confirm_password.value;
    var cause = pw.length < 8 ? 'short' : pw !== confirm ? 'mismatch' : null;
    if (cause) {
      window.location.href = 'new-password-error.html?cause=' + cause + (nq ? '&' + nq : '');
      return;
    }
    var sw = (params.get('fail') === '1' ? '&fail=1' : '') + (params.get('same') === '1' ? '&same=1' : '');
    window.location.href = 'new-password-loading.html?run=1' + (nq ? '&' + nq : '') + sw;
  });
})();
</script>

</body>
</html>
