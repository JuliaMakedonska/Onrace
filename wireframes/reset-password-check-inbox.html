<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password (Check inbox) — Onrace (wireframe)</title>
<style>
  /* STATE: check inbox — Flow 6 ResetInbox (flows.md → Flow 6), the second
     named exception to the state suffixes (_conventions.md § 4): a flow
     step waiting on the inbox, not empty/error/loading. Same drill-down
     chrome and :root tokens as reset-password.html; the form is replaced
     by the step's own content. The copy never claims an email was sent:
     Supabase answers "accepted" whether or not an account exists for the
     address (flows.md → Revision note, password reset). Opening the
     emailed link is modeled by the ?opened=1 reviewer's switch. */

  /* Structure/hierarchy/zones + real interaction only — grayscale, no color,
     no custom fonts, no shadows, no content icons (system-chrome glyphs
     only: the back chevron — § 1). Deferred per _conventions.md § 7. Bare
     screen (_conventions.md § 1): index.html provides the device frame and
     nav tree.

     A step inside the Sign in gate (_conventions.md § 1, "Inside a gate,
     steps drill down"; _screens.md → Reset password → Chrome): it pushes
     inside the modal, so the top bar is "‹ Sign in" (the parent's title,
     because the bar also holds the centred title) — the same iOS
     navigation bar as Log result's, without a trailing button. No tab bar.
     The one action (Send reset link) keeps the gate's rule: at the end of
     the form, in the flow of the content, not in a bottom bar and not in
     the top bar's trailing slot. The body is a flex column: the top bar
     sits above the scrolling .phone-screen, outside it.

     Flow 6 (flows.md → Flow 6 — Reset password): Supabase Auth's
     resetPasswordForEmail(email, { redirectTo }). ?email= and ?next= are
     carried through every page of the flow. */

  /* Softer iOS-style grayscale (_conventions.md § 1): system-gray values
     instead of pure black on white. Still no hue. Radii: --r-sm for small
     controls (inputs), --r for large surfaces (primary button, alert). */
  :root {
    --ink: #1c1c1e;          /* primary text (iOS label) */
    --ink-2: #6c6c70;        /* secondary text */
    --ink-3: #8e8e93;        /* tertiary: placeholder */
    --line: #c6c6c8;         /* borders, separators */
    --line-strong: #8e8e93;  /* emphasized border (alert) */
    --fill-strong: #3a3a3c;  /* current / pressed / primary action */
    --fill-soft: #f2f2f7;    /* placeholder regions, alert background */
    --fill-track: #e9e9eb;   /* segmented-control track */
    --skeleton: #e5e5ea;
    --r-sm: 8px;
    --r: 12px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0 auto;
    max-width: 390px;
    color: var(--ink);
    background: #fff;
    line-height: 1.4;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--ink); }
  [hidden] { display: none !important; }

  /* --- top bar: back (leading) + centred title. Same iOS navigation bar
     as log-result.html (44pt, hairline separator, system font); the title
     is absolutely centred on the bar, as iOS centres it. --- */
  .top-bar {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* system chrome = system font */
    flex: none;
    position: relative;
    display: flex;
    align-items: center;
    height: 44px;            /* iOS navigation bar */
    padding: 0 8px;
    background: #fff;
    border-bottom: 0.5px solid var(--line);
    font-size: 17px;
  }
  /* iOS back button: chevron + the parent's title, no underline */
  .top-bar a {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    color: var(--fill-strong);
    text-decoration: none;
  }
  .back-chevron { display: block; }
  .bar-title {
    position: absolute;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    pointer-events: none;
  }

  .phone-screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .gate { padding: 20px 16px 32px; }
  /* --- Check inbox: a heading, the line naming the address, then the two
     things the person can do here. Resend is a secondary (outlined)
     button: the step's real action, opening the email, happens outside the
     app. Same styling as sign-in-sign-up-check-inbox.html. --- */
  .inbox-heading { margin: 0 0 8px 0; font-size: 1.35rem; font-weight: 700; }
  .inbox-line { margin: 0 0 24px 0; color: var(--ink); }
  .addr { font-weight: 600; word-break: break-all; }

  .secondary-btn {
    display: block;
    width: 100%;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    padding: 12px 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    border-radius: var(--r);
    cursor: pointer;
  }

  .text-link {
    display: block;
    margin: 20px 0 0 0;
    padding: 8px 0;
    text-align: center;
    color: var(--fill-strong);
  }
  .expiry-note { margin: 28px 0 0 0; font-size: 0.8rem; color: var(--ink-2); text-align: center; }
</style>
</head>
<body role="application" aria-label="Onrace — Reset password, check inbox (wireframe)">

  <!-- ZONE: top bar — iOS navigation bar inside the gate (_conventions.md
       § 1, "Inside a gate, steps drill down" and Back navigation;
       _screens.md → Reset password → Chrome). "‹ Sign in" is Flow 6's
       "back to Sign in" edge from ResetInbox → BackToSignIn
       (sign-in-sign-up.html, carrying ?next and ?email). Leaving here
       without ever opening a link is DeadEnd12 (reset never completed) —
       Onrace can't see that happen, so it has no link of its own. The
       centred title names this step, "Check your inbox", as Sign up's
       inbox step does. No tab bar. -->
  <header class="top-bar">
    <a id="back" href="sign-in-sign-up.html"><svg class="back-chevron" aria-hidden="true" width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sign in</span></a>
    <h1 class="bar-title">Check your inbox</h1>
  </header>

  <div class="phone-screen">
    <main class="gate">

      <!-- ZONE: what to do — Flow 6 ResetInbox ("Check inbox: open the
           reset link (only sent if an account exists for this address)",
           flows.md → Flow 6). "Request accepted?" → yes means Supabase took
           the request, not that an email went out, so the line is
           conditional: "If an account exists for …" (_screens.md → Reset
           password → Check inbox). The address is ?email= (what was
           entered), else a sample. -->
      <section aria-labelledby="inbox-heading">
        <h2 class="inbox-heading" id="inbox-heading">Reset your password</h2>
        <p class="inbox-line">If an account exists for <span class="addr" data-email>maya.rossi@example.com</span>, we've sent a link to set a new password. Open it on this device.</p>
      </section>

      <!-- ZONE: resend — Flow 6's "resends" edge → Requesting. Unlike Sign
           up's Check inbox (inline "Sending… / Sent", because Flow 4 draws
           no resend failure), this goes back through
           reset-password-loading.html?run=1, carrying ?email and ?next,
           because Flow 6's Requesting has real failure exits — and a quick
           resend is exactly what trips the rate limit (RateError). On
           success it lands back here. -->
      <a class="secondary-btn" id="resend" href="reset-password-loading.html?run=1">Resend link</a>

      <!-- ZONE: use a different email — back to Reset password with the
           address pre-filled to correct it. A mistyped address is the most
           likely reason no link arrives, and "Resend" can't fix it. Mirrors
           Sign up's Check inbox. Replaced an in-page "Back to Sign in" that
           only repeated the bar's "‹ Sign in" (_critique.md #2); Flow 6's
           "back to Sign in" edge is the bar. Carries ?next and ?email. -->
      <a class="text-link" id="different-email" href="reset-password.html">Use a different email</a>

      <!-- ZONE: expiry note — Flow 6's "Reset link valid?": like Flow 4's
           confirmation links, reset links expire and work once. Said up
           front so an expired link isn't a surprise; the expired case
           itself is new-password-error.html?cause=expired. No duration is
           named: it's a Supabase project setting, not decided yet. -->
      <p class="expiry-note">The link works once and expires after a while. If it doesn't work, send a new one.</p>

      <!-- ZONE: the emailed link, coming back — reviewer's switch, nothing
           rendered (_conventions.md § 2 test switches). ?opened=1 stands in
           for opening the email's link, which opens the app:
             opened=1            "Reset link valid?" → yes — recovery
                                 session started → New password
                                 (new-password.html, carrying ?next and
                                 ?email).
             opened=1&expired=1  → no — expired or already used →
                                 ResetLinkError
                                 (new-password-error.html?cause=expired,
                                 carrying ?next and ?email).
           After ~1s, so the page is visible first. No sign-in session is
           set: a recovery session isn't one (flows.md → Flow 6 → Success). -->

    </main>
  </div><!-- /.phone-screen -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  // ?next= is where the person was heading before the gate. Same allowlist
  // as the Sign in files: owner-only screens only, so the flow can't be
  // pointed anywhere else.
  var next = params.get('next') || '';
  if (!/^(results-list[a-z-]*|log-result[a-z-]*|result-detail[a-z-]*|profile(-loading)?)\.html(\?[^#]*)?$/.test(next)) next = '';

  // ?email= is the address the request was made for; else a sample.
  var email = params.get('email') || '';
  if (!/^[^\s@<>"]{1,64}@[^\s@<>"]{1,190}$/.test(email)) email = '';
  if (email) document.querySelectorAll('[data-email]').forEach(function (el) { el.textContent = email; });

  function query(addr) {
    var q = [];
    if (next) q.push('next=' + encodeURIComponent(next));
    if (addr) q.push('email=' + encodeURIComponent(addr));
    return q;
  }
  var q = query(email);
  var tail = q.length ? '?' + q.join('&') : '';

  // Back to Sign in, Use a different email, and Resend carry ?next and ?email.
  document.getElementById('back').setAttribute('href', 'sign-in-sign-up.html' + tail);
  document.getElementById('different-email').setAttribute('href', 'reset-password.html' + tail);
  document.getElementById('resend').setAttribute('href', 'reset-password-loading.html?' + ['run=1'].concat(q).join('&'));

  // Reviewer's switch: the emailed link opening the app (see ZONE).
  if (params.get('opened') !== '1') return;
  window.setTimeout(function () {
    if (params.get('expired') === '1') {
      window.location.replace('new-password-error.html?' + ['cause=expired'].concat(q).join('&'));
      return;
    }
    window.location.replace('new-password.html' + tail);
  }, 1000);
})();
</script>

</body>
</html>
