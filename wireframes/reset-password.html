<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=1b2fadee">
</head>
<body class="onrace" role="application" aria-label="Onrace — Reset password (wireframe)">

  <!-- ZONE: top bar — iOS navigation bar inside the gate (_conventions.md
       § 1, "Inside a gate, steps drill down" and Back navigation;
       _screens.md → Reset password → Chrome). "‹ Sign in" is Flow 6's
       "back" edge → BackToSignIn (sign-in-sign-up.html, carrying ?next and
       ?email so the typed address is still there). On the error page it is
       also Retry? → no / "gives up" (DeadEnd11: leaves without a reset
       link), so no error repeats it as a button. The title "Reset
       password" is centred in the bar. No tab bar. -->
  <header class="top-bar">
    <a id="back" href="sign-in-sign-up.html"><svg class="back-chevron" aria-hidden="true" width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sign in</span></a>
    <h1 class="bar-title">Reset password</h1>
    <button type="submit" form="reset-form" class="bar-action">Send<span class="visually-hidden"> reset link</span></button>
  </header>

  <div class="phone-screen">
    <main class="gate">

      <!-- ZONE: what this does — one line of context. It promises a link,
           not an email "sent to your account": Onrace can't know whether an
           account exists (flows.md → Revision note, password reset). -->
      <p class="context">Enter the email you signed up with, and we’ll send a reset link to it.</p>

      <!-- ZONE: request form — Email, then the one action at the end of the
           form, in content flow (the gate's rule, _conventions.md § 1,
           Gates / Inside a gate). Email is pre-filled from ?email= (what was
           typed on Sign in; _screens.md → Reset password: "It carries
           email"). Native required / type=email validation is the only
           client check: Flow 6 draws none before the request. Submitting is
           Flow 6's "submits email" edge → Requesting ("Loading: sending
           reset link", reset-password-loading.html?run=1, carrying ?email
           and ?next). -->
      <form id="reset-form" class="form-rows">
        <fieldset>
          <div class="group">
            <ul class="rows">
              <li><div class="row"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="e.g. you@example.com" required></div></li>
            </ul>
          </div>

        </fieldset>
      </form>

    </main>
  </div><!-- /.phone-screen -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  // ?next= is where the person was heading before the gate. Same allowlist
  // as the Sign in files: owner-only screens only, so the flow can't be
  // pointed anywhere else.
  var next = params.get('next') || '';
  if (!/^(results-list[a-z-]*|log-result[a-z-]*|result-detail[a-z-]*|profile(-loading)?)\.html(\?[^#]*)?$/.test(next)) next = '';

  // ?email= prefills the field (typed on Sign in, or coming back).
  var email = params.get('email') || '';
  if (!/^[^\s@<>"]{1,64}@[^\s@<>"]{1,190}$/.test(email)) email = '';
  var input = document.getElementById('email');
  if (email) input.value = email;

  function query(addr) {
    var q = [];
    if (next) q.push('next=' + encodeURIComponent(next));
    if (addr) q.push('email=' + encodeURIComponent(addr));
    return q;
  }

  // "‹ Sign in": back to the gate with ?next and whatever is typed now.
  var back = document.getElementById('back');
  function setBack() {
    var q = query(input.value.trim());
    back.setAttribute('href', 'sign-in-sign-up.html' + (q.length ? '?' + q.join('&') : ''));
  }
  setBack();
  input.addEventListener('input', setBack);

  // "Submits email" (Flow 6) → Requesting. Native validation runs first.
  document.getElementById('reset-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = ['run=1'].concat(query(input.value.trim()));
    window.location.href = 'reset-password-loading.html?' + q.join('&');
  });
})();
</script>

</body>
</html>
