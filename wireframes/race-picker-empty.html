<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race picker (Empty) — Onrace (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="../ui/kit.css?v=9aafa41b">
</head>
<body class="onrace" role="application" aria-label="Onrace — Race picker, empty state (wireframe)">

  <div class="sheet">

    <!-- ZONE: modal top bar — Cancel + title (_conventions.md § 1,
         "Pickers are modal sheets"; _screens.md → Race picker → Chrome).
         Cancel is flows.md's Picker → "cancels — form unchanged" → LogForm:
         it returns to log-result.html with every carried value, catalog=
         included if a race was already linked, so the form is exactly as it
         was. Here it is also a second way to "type it in instead". No Save: selecting a row is the action. No tab bar. -->
    <header class="top-bar">
      <a class="cancel" href="log-result.html" data-back-to-form>Cancel</a>
      <h1 class="bar-title">Find a race</h1>
    </header>

    <!-- ZONE: search — _screens.md → Race picker → What it lists: matches
         name or city, runs on submit (the keyboard's Search key) and goes
         through the loading page like Race browse's filter changes
         (flows.md: Picker → "searches" → PickerLoading). A real GET form to
         race-picker-loading.html?run=1&q=<query>&<carried values>; the
         hidden inputs carry Log result's values (the script fills them from
         the URL and disables the empty ones so they aren't sent). Stays pre-filled with the query: editing it and searching again is flows.md's PickerEmpty → "changes the search" → Picker (through the loading page). -->
    <form class="search" id="picker-search" role="search" action="race-picker-loading.html" method="get">
      <input type="hidden" name="run" value="1">
      <label for="q" class="visually-hidden">Search races by name or city</label>
      <input type="search" id="q" name="q" placeholder="Race name or city" enterkeyhint="search" autocomplete="off">
      <input type="hidden" name="race_name">
      <input type="hidden" name="date">
      <input type="hidden" name="sport_type">
      <input type="hidden" name="finish_time">
      <input type="hidden" name="official_result_url">
      <input type="hidden" name="catalog">
    </form>

    <div class="phone-screen">

      <!-- ZONE: empty state — replaces the race rows (_screens.md → Race
           picker → Empty; flows.md: PickerMatches → no → PickerEmpty, "no
           catalog race matches"). Not an error, so no retry. Exits: "changes
           the search" is the search field above, still holding the query;
           "types the race in instead" is the button, back to
           log-result.html with every carried value (catalog= too, if one was
           already linked: this only means the search found nothing). The
           copy says why a race might be missing: only past races are
           listed, and the catalog is hand-curated (CLAUDE.md → Race data). -->
      <main>
        <div class="state-message" role="status">
          <h2>No past races match “<span data-q></span>”</h2>
          <p>Only past races in the race catalog appear here, and this one may not be in it yet. Check the spelling, try the city instead of the race name, or type the race in yourself.</p>
          <div class="state-actions">
            <a class="state-action" href="log-result.html" data-back-to-form>Type it in instead</a>
          </div>
        </div>
      </main>

    </div><!-- /.phone-screen -->

  </div><!-- /.sheet -->

<script>
/* The Race picker's sample catalog (_screens.md → Race picker → Sample
   catalog: past editions, newest first). Embedded once per file, identical
   in log-result*.html and race-picker*.html. Global so the script below
   can read it. */
var CATALOG = [
  { slug: 'utmb-2026', name: 'UTMB — Ultra-Trail du Mont-Blanc', date: '2026-08-28', short: '28 Aug 2026', long: '28 August 2026', sport: 'ultra', sportType: 'Ultra', tag: 'Ultra', city: 'Chamonix', country: 'France' },
  { slug: 'boston-marathon-2026', name: 'Boston Marathon', date: '2026-04-20', short: '20 Apr 2026', long: '20 April 2026', sport: 'marathon', sportType: 'Marathon', tag: 'Marathon', city: 'Boston', country: 'USA' },
  { slug: 'deka-strong-chicago-2026', name: 'DEKA STRONG Chicago', date: '2026-03-14', short: '14 Mar 2026', long: '14 March 2026', sport: 'deka', sportType: 'DEKA / functional fitness', tag: 'DEKA', city: 'Chicago', country: 'USA' },
  { slug: 'hyrox-dallas-2026', name: 'HYROX Dallas', date: '2026-01-17', short: '17 Jan 2026', long: '17 January 2026', sport: 'hyrox', sportType: 'HYROX', tag: 'HYROX', city: 'Dallas', country: 'USA' },
  { slug: 'hyrox-london-2025', name: 'HYROX London', date: '2025-12-06', short: '6 Dec 2025', long: '6 December 2025', sport: 'hyrox', sportType: 'HYROX', tag: 'HYROX', city: 'London', country: 'UK' },
  { slug: 'valencia-half-2025', name: 'Valencia Half Marathon', date: '2025-10-26', short: '26 Oct 2025', long: '26 October 2025', sport: 'half-marathon', sportType: 'Half marathon', tag: 'Half marathon', city: 'Valencia', country: 'Spain' },
  { slug: 'berlin-marathon-2025', name: 'Berlin Marathon', date: '2025-09-21', short: '21 Sep 2025', long: '21 September 2025', sport: 'marathon', sportType: 'Marathon', tag: 'Marathon', city: 'Berlin', country: 'Germany' },
  { slug: 'spartan-beast-killington-2025', name: 'Spartan Race Beast — Killington', date: '2025-09-13', short: '13 Sep 2025', long: '13 September 2025', sport: 'ocr', sportType: 'OCR', tag: 'OCR', city: 'Killington', country: 'USA' }
];
</script>

<script>
/* Race picker, empty (PickerEmpty): carried values, the search that
   stays pre-filled, and "Type it in instead". */
(function () {
  var CARRY = ['race_name', 'date', 'sport_type', 'finish_time', 'official_result_url', 'catalog'];
  var params = new URLSearchParams(window.location.search);
  var q = (params.get('q') || '').trim();

  // Log result's values as they arrived — only the non-empty ones, minus
  // any keys in skip.
  function carried(skip) {
    var p = new URLSearchParams();
    CARRY.forEach(function (k) {
      if (skip && skip.indexOf(k) > -1) return;
      var v = params.get(k);
      if (v) p.set(k, v);
    });
    return p;
  }
  function withQuery(p) {
    var out = new URLSearchParams();
    if (q) out.set('q', q);
    p.forEach(function (v, k) { out.append(k, v); });
    return out;
  }
  function url(page, p) {
    var s = p.toString();
    return page + (s ? '?' + s : '');
  }
  // PickerMatches? — name or city, case-insensitive.
  function matches(r) {
    if (!q) return true;
    var needle = q.toLowerCase();
    return r.name.toLowerCase().indexOf(needle) > -1 || r.city.toLowerCase().indexOf(needle) > -1;
  }

  // Cancel, and "Type it in instead": back to the form, values intact.
  document.querySelectorAll('[data-back-to-form]').forEach(function (a) {
    a.href = url('log-result.html', carried());
  });

  // Search: show the current query, carry the form's values as hidden
  // inputs (disabled when empty, so they aren't sent).
  var search = document.getElementById('picker-search');
  search.elements.q.value = q;
  CARRY.forEach(function (k) {
    var input = search.querySelector('input[type="hidden"][name="' + k + '"]');
    var v = params.get(k);
    if (v) input.value = v; else input.disabled = true;
  });
  document.querySelectorAll('[data-q]').forEach(function (el) { el.textContent = q; });
})();
</script>

</body>
</html>
