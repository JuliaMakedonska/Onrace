<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password (Loading) — Onrace (wireframe)</title>
<style>
  /* STATE: loading — same structure and zones as reset-password.html;
     the form is shown submitted and locked (_conventions.md § 5). */

  /* Structure/hierarchy/zones + real interaction only — grayscale, no color,
     no custom fonts, no shadows, no content icons (system-chrome glyphs
     only: the back chevron — § 1). Deferred per _conventions.md § 7. Bare
     screen (_conventions.md § 1): index.html provides the device frame and
     nav tree.

     A step inside the Sign in gate (_conventions.md § 1, "Inside a gate,
     steps drill down"; _screens.md → Reset password → Chrome): it pushes
     inside the modal, so the top bar is "‹ Sign in" (the parent's title,
     because the bar also holds the centred title) — the same iOS
     navigation bar as Log result's, without a trailing button. No tab bar.
     The one action (Send reset link) keeps the gate's rule: at the end of
     the form, in the flow of the content, not in a bottom bar and not in
     the top bar's trailing slot. The body is a flex column: the top bar
     sits above the scrolling .phone-screen, outside it.

     Flow 6 (flows.md → Flow 6 — Reset password): Supabase Auth's
     resetPasswordForEmail(email, { redirectTo }). ?email= and ?next= are
     carried through every page of the flow. */

  /* Softer iOS-style grayscale (_conventions.md § 1): system-gray values
     instead of pure black on white. Still no hue. Radii: --r-sm for small
     controls (inputs), --r for large surfaces (primary button, alert). */
  :root {
    --ink: #1c1c1e;          /* primary text (iOS label) */
    --ink-2: #6c6c70;        /* secondary text */
    --ink-3: #8e8e93;        /* tertiary: placeholder */
    --line: #c6c6c8;         /* borders, separators */
    --line-strong: #8e8e93;  /* emphasized border (alert) */
    --fill-strong: #3a3a3c;  /* current / pressed / primary action */
    --fill-soft: #f2f2f7;    /* placeholder regions, alert background */
    --fill-track: #e9e9eb;   /* segmented-control track */
    --skeleton: #e5e5ea;
    --r-sm: 8px;
    --r: 12px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0 auto;
    max-width: 390px;
    color: var(--ink);
    background: #fff;
    line-height: 1.4;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--ink); }
  [hidden] { display: none !important; }

  /* --- top bar: back (leading) + centred title. Same iOS navigation bar
     as log-result.html (44pt, hairline separator, system font); the title
     is absolutely centred on the bar, as iOS centres it. --- */
  .top-bar {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* system chrome = system font */
    flex: none;
    position: relative;
    display: flex;
    align-items: center;
    height: 44px;            /* iOS navigation bar */
    padding: 0 8px;
    background: #fff;
    border-bottom: 0.5px solid var(--line);
    font-size: 17px;
  }
  /* iOS back button: chevron + the parent's title, no underline */
  .top-bar a {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    color: var(--fill-strong);
    text-decoration: none;
  }
  .back-chevron { display: block; }
  .bar-title {
    position: absolute;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    pointer-events: none;
  }

  .phone-screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .gate { padding: 20px 16px 32px; }
  .context { margin: 0 0 20px 0; font-size: 0.95rem; color: var(--ink-2); }

  /* --- the form: label above the field, full-width input. --- */
  fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
  .field { margin: 0 0 16px 0; }
  .field label { display: block; font-size: 0.85rem; color: var(--ink-2); margin: 0 0 6px 0; }
  .field input {
    display: block;
    width: 100%;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 0 12px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }
  .field input::placeholder { color: var(--ink-3); }
  .field input:disabled { background: var(--fill-soft); color: var(--ink-2); }

  .submit-btn {
    display: block;
    width: 100%;
    margin: 8px 0 0 0;
    border: 1px solid var(--line);
    background: var(--fill-strong);
    color: #fff;
    padding: 12px 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    border-radius: var(--r);
    cursor: pointer;
  }
  .submit-btn:disabled { cursor: default; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body role="application" aria-label="Onrace — Reset password, loading state (wireframe)">

  <!-- ZONE: top bar — iOS navigation bar inside the gate (_conventions.md
       § 1, "Inside a gate, steps drill down" and Back navigation;
       _screens.md → Reset password → Chrome). "‹ Sign in" is Flow 6's
       "back" edge → BackToSignIn (sign-in-sign-up.html, carrying ?next and
       ?email so the typed address is still there). On the error page it is
       also Retry? → no / "gives up" (DeadEnd11: leaves without a reset
       link), so no error repeats it as a button. The title "Reset
       password" is centred in the bar. No tab bar. It stays usable while
       loading: it doesn't depend on the request. -->
  <header class="top-bar">
    <a id="back" href="sign-in-sign-up.html"><svg class="back-chevron" aria-hidden="true" width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sign in</span></a>
    <h1 class="bar-title">Reset password</h1>
  </header>

  <div class="phone-screen">
    <main class="gate">

      <!-- ZONE: what this does — one line of context. It promises a link,
           not an email "sent to your account": Onrace can't know whether an
           account exists (flows.md → Revision note, password reset). -->
      <p class="context">Enter the email you signed up with and we'll send a link to set a new password.</p>

      <!-- ZONE: request form, submitted — the same Email field and action
           as reset-password.html, locked (fieldset disabled). The email
           shown is the one entered (?email=), else a sample. -->
      <form id="reset-form" aria-busy="true">
        <fieldset disabled>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" required value="maya.rossi@example.com">
          </div>
          <button type="submit" class="submit-btn">Sending…</button>
        </fieldset>

        <!-- ZONE: status — Requesting: "Loading: sending reset link"
             (flows.md → Flow 6). The button itself says what's happening;
             the visually-hidden status carries it for assistive tech. -->
        <p class="visually-hidden" role="status">Sending the reset link…</p>
      </form>

    </main>
  </div><!-- /.phone-screen -->

<script>
(function () {
  var params = new URLSearchParams(window.location.search);

  // ?next= is where the person was heading before the gate. Same allowlist
  // as the Sign in files: owner-only screens only, so the flow can't be
  // pointed anywhere else.
  var next = params.get('next') || '';
  if (!/^(results-list[a-z-]*|log-result[a-z-]*|result-detail[a-z-]*|profile(-loading)?)\.html(\?[^#]*)?$/.test(next)) next = '';

  // The entered email travels as ?email= so Check inbox can name it.
  var email = params.get('email') || '';
  if (!/^[^\s@<>"]{1,64}@[^\s@<>"]{1,190}$/.test(email)) email = '';
  if (email) document.getElementById('email').value = email;

  function query(addr) {
    var q = [];
    if (next) q.push('next=' + encodeURIComponent(next));
    if (addr) q.push('email=' + encodeURIComponent(addr));
    return q;
  }

  // "‹ Sign in": back to the gate with ?next and ?email.
  var bq = query(email);
  document.getElementById('back').setAttribute('href', 'sign-in-sign-up.html' + (bq.length ? '?' + bq.join('&') : ''));

  // Only when reached through the flow (?run=1, set by the form's submit
  // and by Check inbox's Resend link): after a short delay, answer
  // "Request accepted?" (Flow 6). Opened on its own (e.g. from index.html)
  // it stays put for inspection. Test switches (_conventions.md § 2),
  // nothing rendered for them:
  //   offline or &fail=1 → "no — connection" → reset-password-error.html
  //                        (RequestError).
  //   &rate=1            → "no — too many requests" →
  //                        reset-password-error.html?cause=rate (RateError).
  //   otherwise          → "yes — sent if an account exists" →
  //                        reset-password-check-inbox.html (ResetInbox).
  // ?email and ?next are carried to every exit.
  if (params.get('run') !== '1') return;
  window.setTimeout(function () {
    var q = query(email);
    if (!navigator.onLine || params.get('fail') === '1') {
      window.location.replace('reset-password-error.html' + (q.length ? '?' + q.join('&') : ''));
      return;
    }
    if (params.get('rate') === '1') {
      window.location.replace('reset-password-error.html?' + ['cause=rate'].concat(q).join('&'));
      return;
    }
    window.location.replace('reset-password-check-inbox.html' + (q.length ? '?' + q.join('&') : ''));
  }, 1200);
})();
</script>

</body>
</html>
